<style>
/* VOICE: calm money tool, newspaper-graphics clarity, numbers first.
   IDEA: the month as a metro line — days are track, recurring payments are stations, the terminal is the projected balance.
   PICTURE: "Línea del mes" on Inicio; gasto acumulado and 6-month bars below.
   COLOUR and TYPE: white / night #0e1116; blue ingresos & track, red gastos, green inversión, amber only for warnings. Figtree 800 + Figtree.
   LAYOUT: one column on phone with bottom bar and a big +; sidebar and two-column cards from 900px. */
:root{--bg:#ffffff;--panel:#f3f4f6;--panel2:#e9ebef;--line:#dfe2e7;--ink:#0b0d10;--ink2:#474c55;--ink3:#6c727c;--blue:#0a5cff;--red:#e6261f;--green:#00a05a;--amber:#ffb400;--amberInk:#7a4f00;--amberBg:#fff4d6;--redBg:#fde8e7;--track:#cfd4dc;--c1:#0a5cff;--c2:#d9730d;--c3:#0e9f8e;--ov:rgba(10,12,16,.45);--shadow:0 10px 30px rgba(10,12,16,.12)}

html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.num,.amt input,td.r,.v{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{min-height:100vh}
@media(min-width:900px){.app{display:grid;grid-template-columns:236px minmax(0,1fr)}}
/* side nav */
.side{display:none}
@media(min-width:900px){.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line)}

.side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:600;min-height:44px}
.side a[aria-current=page]{background:var(--panel);color:var(--ink)}
.side .new{margin-top:12px}}
.side svg,.bot svg{width:22px;height:22px;flex:none}
/* top */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) max(4vw,16px) 8px;background:var(--bg);border-bottom:1px solid var(--line)}

.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink3);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.sync.ok i{background:var(--green)}.sync.busy i{background:var(--amber)}.sync.err i{background:var(--red)}
@media(max-width:520px){.sync b{display:none}}
main{padding:14px max(4vw,16px) calc(104px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto;width:100%}

.bot .plus svg{width:28px;height:28px}

/* typography */

/* alerts */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--amberBg);color:var(--ink);font-size:15px}
.alert.over{background:var(--redBg)}
.alert .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--amber);color:#1a1200}
.alert.over .ic{background:var(--red);color:#fff}
.alert.info{background:var(--panel)}.alert.info .ic{background:var(--blue);color:#fff}
.alert a,.alert button.link{margin-left:auto}
/* buttons */
.btn,.pri,.ghost{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.ghost{background:none}
.danger{color:var(--red)}
.link{background:none;border:0;color:var(--blue);font-weight:700;padding:6px 4px;min-height:36px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.acts .pri{flex:1 1 160px}
/* forms */
input[type=text],input[type=date],input[type=number],input[type=search],input:not([type]),select,textarea{min-height:44px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;width:100%}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
select{appearance:auto}
.fl{display:grid;gap:6px;margin-top:12px}
.fl>span{font-size:13px;font-weight:700;color:var(--ink2)}
.fl .row input[type=date]{flex:1 1 150px;width:auto}
.two-in{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--blue)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border-radius:12px;padding:3px;gap:3px}
.seg.s3{grid-template-columns:repeat(3,minmax(0,1fr))}.seg.s4{grid-template-columns:repeat(4,minmax(0,1fr))}.seg.s5{grid-template-columns:repeat(5,minmax(0,1fr))}.seg.s5 button{font-size:13px;padding-left:2px;padding-right:2px}.row>.link{white-space:nowrap}
.pbar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 8px}.pbar span{display:block;height:100%}.pbar span:first-child{border-radius:7px 0 0 7px}.pbar span:last-child{border-radius:0 7px 7px 0}.pbar span:only-child{border-radius:7px}.plg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}.plg .row{padding:3px 0;font-size:15px}.plg i.ln{width:14px;height:3px;border-radius:2px;vertical-align:3px}.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}.chip .cdot{margin-right:6px}.chip:disabled{opacity:.45}.ct2{table-layout:fixed}.ctab.ct2 th,.ctab.ct2 td{white-space:normal}.ctab.ct2 td.wr,.ctab.ct2 th{overflow-wrap:anywhere}.ctab.ct2 td{padding:7px 4px;font-variant-numeric:tabular-nums}.ctab.ct2 td.r{font-size:14px}.ctab.ct2 th{padding:4px}.ct2 th{vertical-align:bottom;font-size:13px}.ct2 th:first-child,.ct2 td:first-child{width:30%}.ct2 td.wr{font-size:14px}.hb{margin-top:6px}.hbr{margin-top:12px}.hbl{font-size:14px;color:var(--ink2);margin-bottom:4px}.hbb{display:flex;align-items:center;gap:8px;margin-top:3px}.hbt{flex:1;height:8px}.hbf{display:block;height:8px;border-radius:0 4px 4px 0}.hbv{flex:0 0 64px;text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}.exck{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;padding:8px 0;cursor:pointer}.exck input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--blue)}.exck b{display:block;font-size:16px}.exck .sm{display:block;line-height:1.35;margin-top:2px}.exr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;grid-template-areas:"m y x" "a a a";gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);align-items:center}.exr:first-child{border-top:0;padding-top:0}.exr [data-f=m]{grid-area:m}.exr [data-f=y]{grid-area:y}.exr [data-f=a]{grid-area:a}.exr .btn{grid-area:x;min-width:44px;padding-left:0;padding-right:0}.exr select,.exr input{min-width:0;width:100%}@media(min-width:520px){.exr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) 44px;grid-template-areas:"m y a x";border-top:0;padding-top:0;margin-top:8px}}.ctab{width:100%;border-collapse:collapse;font-size:15px}.ctab th{font-size:13px;color:var(--ink3);font-weight:700;padding:4px 6px;text-align:left}.ctab th.r,.ctab td.r{text-align:right}.ctab td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}.ctab td.r{white-space:nowrap}.ctab td.wr{white-space:normal;font-size:14px}.ctab td:first-child{color:var(--ink2)}.patmini{display:block;text-decoration:none;color:inherit}
.it.dj .t2{white-space:normal;overflow:visible}#o-n{font:inherit;font-size:16px;line-height:1.4}.dj .t3{display:block;font-size:13px;color:var(--ink2);margin-top:3px;white-space:pre-line;overflow-wrap:anywhere}.dj .mot{display:inline-block;font-size:12px;font-weight:700;background:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:4px 4px 0 0;color:var(--ink2)}.dj{align-items:flex-start}.dj .ty{margin-top:2px}
.gi{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);background:none;font:800 11px/1 Figtree,sans-serif;padding:0;margin:0 1px;vertical-align:1px;cursor:pointer}.gi::after{content:'';position:absolute;inset:-12px}.gi[aria-expanded=true]{background:var(--blue);color:#fff}
.glos{background:var(--panel);border-radius:12px;padding:10px 12px;margin:6px 0 8px;font-size:14px;line-height:1.5}.fsum p{margin:0 0 8px;line-height:1.55}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;font-weight:700;font-size:14px;color:var(--ink2);padding:4px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 4px}
.amt input{border:0;background:none;text-align:right;font:800 44px/1.1 Figtree,sans-serif;width:4.2ch;max-width:80vw;min-height:56px;padding:0}
.amt input:focus{outline:none}
.amt b{font:800 28px Figtree,sans-serif;color:var(--ink3)}
.sheet .acts{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--bg);padding:12px 0 calc(6px + env(safe-area-inset-bottom));margin-bottom:calc(-18px - env(safe-area-inset-bottom));z-index:2}
.rt{text-align:right}@media(max-width:520px){.rt{text-align:left}}
.amt-line{height:3px;border-radius:2px;background:var(--line);max-width:260px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:0;margin-top:8px}
/* lists */
.list{display:grid}
.it{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;min-height:56px}
.it:last-child{border-bottom:0}
.it .tx{flex:1;overflow:hidden}
.it .t1,.it .t2{display:block}
.it .t1{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.it .t2{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .am{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.am.i{color:var(--blue)}.am.inv{color:var(--green)}.am.tr,.am.aj,.am.rem{color:var(--ink2)}
.ty{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:800;font-size:15px;color:var(--ink2)}
.ty.g{color:var(--red)}.ty.i{color:var(--blue)}.ty.inv{color:var(--green)}.ty.tr,.ty.rem{color:var(--ink2)}
.grp{font-size:13px;font-weight:800;color:var(--ink3);margin:14px 0 2px}
.day{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink3);padding:14px 2px 2px;text-transform:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--ink2);margin-left:6px;vertical-align:1px}
.tag.warn{background:var(--amberBg);color:var(--amberInk)}.tag.over{background:var(--redBg);color:var(--red)}
.tag.ok{background:var(--panel2);color:var(--green)}
/* bars */
.bars{display:grid;gap:12px}
.bar .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:15px}
.bar .hd b{font-weight:600}
.bar .hd span{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2);margin-left:auto}
.trk{position:relative;height:10px;border-radius:5px;background:var(--panel2);margin-top:5px;overflow:visible}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--blue);max-width:100%}
.fill.warn{background:var(--amber)}.fill.over{background:var(--red)}
.mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.scale{position:relative;height:14px;border-radius:7px;background:var(--panel2);margin:14px 0 6px}
.scale .fill{border-radius:7px}
.scale .mark{top:-6px;bottom:-6px}
.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3)}
/* figures */
.fig{position:relative;min-height:220px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig.metro{min-height:150px}
.fig.sm{min-height:200px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;white-space:nowrap;z-index:3;display:none}
.tip b{font-weight:800}
svg text{font-family:Figtree,system-ui,sans-serif}
/* metro list */
.stops{display:grid;gap:0;margin-top:6px}
.stop{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.stop .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink3);flex:none}
.stop .dot.i{border-color:var(--blue)}.stop .dot.g{border-color:var(--red)}.stop .dot.inv{border-color:var(--green)}
.stop .dot.done{background:currentColor}
.stop .tx{flex:1 1 150px}
.stop .row{gap:4px}
.stop .link{min-height:40px}
/* table */
.scroll{overflow-x:auto}
.ftab th{white-space:normal;vertical-align:bottom;min-width:76px;line-height:1.25}.ftab th:first-child{min-width:0}.ftab th:first-child,.ftab td:first-child{position:sticky;left:0;background:var(--panel);z-index:1}.swipe{display:none}@media (max-width:640px){.swipe{display:block}}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--ink3);font-weight:700}
td.r,th.r{text-align:right;white-space:nowrap}
tr.dup td{color:var(--ink3)}tr.bad td{color:var(--red)}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:var(--ov);display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px max(4vw,16px) calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow);display:none;overscroll-behavior:contain}

<script>
{
'use strict';
/* ---------- helpers ---------- */
const D=document;
const $=(s,r=D)=>r.querySelector(s), $$=(s,r=D)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF2=new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true});
const NF0=new Intl.NumberFormat('es-ES',{maximumFractionDigits:0,useGrouping:true});
const NF1=new Intl.NumberFormat('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});
const eur=c=>NF2.format((c||0)/100)+' €';
const eur0=c=>NF0.format(Math.round((c||0)/100))+' €';
const seur=c=>(c>0?'+':c<0?'−':'')+eur(Math.abs(c));
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n,day)=>{const d=pd(s),y=d.getFullYear(),m=d.getMonth()+n,want=day||d.getDate(),last=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(want,last)))};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fdate=s=>{const d=pd(s);return d.getDate()+' '+MESC[d.getMonth()]};
const fdateL=s=>{const d=pd(s);return cap(DIAS[d.getDay()])+' '+d.getDate()+' '+MESC[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const normTxt=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const normKey=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,28);
const STOP=new Set(['compra','pago','tarjeta','tarj','con','por','recibo','adeudo','cargo','transaccion','www','com','fecha','operacion','sepa','domiciliado','domiciliacion','the','las','los','del','para','apple','pay','google','bizum']);
const normSub=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[0-9]+/g,' ').replace(/[^a-z ]+/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).slice(0,3).join(' ');
/* amounts typed by hand: "25", "25,5", "25.50", "1.234,56" */
function parseTyped(s){s=String(s||'').trim().replace(/\s|€/g,'');if(!s)return null;let neg=/^[-−]/.test(s);s=s.replace(/[-−+]/g,'');if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else{const p=s.split('.');if(p.length>2||(p.length===2&&p[1].length===3))s=s.replace(/\./g,'')}const n=Number(s);if(!isFinite(n))return null;return Math.round(n*100)*(neg?-1:1)}
const plu=(n,a,b)=>n+' '+(n===1?a:b);
const typedOf=c=>c==null?'':NF2.format(c/100).replace(/\./g,'');

/* ---------- defaults ---------- */
const DEF_G=['Ocio y salidas','Comida fuera','Transporte','Ropa y cuidado personal','Suscripciones','Formación y libros','Tecnología','Regalos','Caprichos','Clubes y asociaciones','Comisiones','Otros'];
const DEF_I=['Nómina','Beca','Recargas familiares','Intereses','Dividendos','Otros'];
const TYPES=[['g','Gasto'],['i','Ingreso'],['tr','Traspaso'],['inv','Inversión']];
const TNAME={g:'Gasto',i:'Ingreso',tr:'Traspaso',inv:'Inversión',aj:'Ajuste de saldo',rem:'Venta / rescate'};
const FREQ={m:'mensual',w:'semanal',q:'trimestral',y:'anual'};
const ACCT={c:'Cuenta corriente (día a día)',t:'Tarjeta / prepago',r:'Ahorro remunerado',e:'Efectivo',f:'Cuenta de fondos',v:'Cuenta de valores (acciones y ETFs)',o:'Otra'};
function defaultCfg(){return{v:1,goals:[],sims:[],accounts:[],cats:[...DEF_G.map((n,k)=>({id:'g'+k,n,t:'g'})),...DEF_I.map((n,k)=>({id:'i'+k,n,t:'i'}))],budgets:{},rec:[],skip:[],ignSubs:[],maps:{},set:{ms:1,wp:80,rm:'auto',rv:null,ct:null,da:''}}}
function normCfg(c){const d=defaultCfg();c=c&&typeof c==='object'?c:{};return{...d,...c,set:{...d.set,...(c.set||{})},accounts:Array.isArray(c.accounts)?c.accounts:[],cats:Array.isArray(c.cats)&&c.cats.length?c.cats:d.cats,budgets:c.budgets||{},rec:Array.isArray(c.rec)?c.rec:[],skip:Array.isArray(c.skip)?c.skip:[],ignSubs:Array.isArray(c.ignSubs)?c.ignSubs:[],maps:c.maps||{},goals:Array.isArray(c.goals)?c.goals:[],sims:Array.isArray(c.sims)?c.sims:[]}}

/* ---------- state ---------- */
const S={cfg:defaultCfg(),inv:{v:1,ins:[],ops:[],tgt:{cls:{},reg:{},band:5},incLiq:false,coef:{}},months:{},po:0,am:'cls',allOps:false,mf:{q:'',t:'',c:'',a:'',all:false,unc:false},df:{q:'',t:'',ins:'',y:''},loaded:false};
let txCache=null;
const dirty=()=>{txCache=null;invCache=null;coefCache=null};
function allTx(){if(txCache)return txCache;const a=[];for(const k in S.months){const t=S.months[k].tx||{};for(const id in t)a.push(t[id])}a.sort((x,y)=>x.d<y.d?1:x.d>y.d?-1:(y.ts||0)-(x.ts||0));return txCache=a}
function putTx(t){const ym=t.d.slice(0,7);(S.months[ym]??={tx:{}}).tx[t.id]=t;dirty();return'm-'+ym}
function delTx(id){for(const k in S.months){if(S.months[k].tx&&S.months[k].tx[id]){delete S.months[k].tx[id];dirty();return'm-'+k}}return null}
function findTx(id){for(const k in S.months){const t=S.months[k].tx&&S.months[k].tx[id];if(t)return t}return null}
const cat=id=>S.cfg.cats.find(c=>c.id===id);
const acc=id=>S.cfg.accounts.find(a=>a.id===id);
const catName=id=>id?(cat(id)?.n||'Categoría borrada'):'Sin categoría';
const accName=id=>id?(acc(id)?.n||'Cuenta borrada'):'Sin cuenta';
const activeAccs=()=>S.cfg.accounts.filter(a=>!a.arch);

/* ---------- persistence (claude db, private per user) ---------- */
let db=null,base=null,mode='connecting';
const pend=new Map();
function setSync(st,txt){const el=$('#sync');el.className='sync '+st;el.innerHTML='<i></i><b>'+esc(txt)+'</b>';el.title=txt}
/* ---------- sincronización entre dispositivos ----------
   BASE guarda la última versión de cada documento que sabemos que está en el servidor.
   Antes de cada escritura se lee el servidor y se combinan, elemento a elemento, los cambios de este dispositivo (respecto a BASE)
   con los del otro (servidor respecto a BASE). Si los dos cambiaron lo mismo, gana este dispositivo. Así dos dispositivos
   que apuntan a la vez no se pisan los movimientos ni las operaciones. */
const BASE=new Map();
function canon(v){if(Array.isArray(v))return'['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return v===undefined?'~':JSON.stringify(v)}
const same=(a,b)=>canon(a)===canon(b),jclone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
const isObjV=x=>!!x&&typeof x==='object'&&!Array.isArray(x),idArr=a=>Array.isArray(a)&&a.every(x=>isObjV(x)&&typeof x.id==='string'&&x.id);
function merge3(b,m,t){if(same(m,b))return jclone(t);if(same(t,b)||same(m,t))return jclone(m);
  if(m===undefined||t===undefined)return jclone(m);
  if(isObjV(m)&&isObjV(t)){const bb=isObjV(b)?b:{},r={};for(const k of new Set([...Object.keys(m),...Object.keys(t)])){const v=merge3(bb[k],m[k],t[k]);if(v!==undefined)r[k]=v}return r}
  if(Array.isArray(m)&&Array.isArray(t)){const bb=Array.isArray(b)?b:[];
    if(idArr(m)&&idArr(t)&&idArr(bb)){const B=new Map(bb.map(x=>[x.id,x])),M=new Map(m.map(x=>[x.id,x])),T=new Map(t.map(x=>[x.id,x])),ids=[...M.keys(),...[...T.keys()].filter(k=>!M.has(k))],r=[];for(const id of ids){const v=merge3(B.get(id),M.get(id),T.get(id));if(v!==undefined)r.push(v)}return r}
    const cb=new Set(bb.map(canon)),cm=new Set(m.map(canon)),ct=new Set(t.map(canon));const r=m.filter(x=>{const c=canon(x);return!(cb.has(c)&&!ct.has(c))});for(const x of t){const c=canon(x);if(!cb.has(c)&&!cm.has(c)){r.push(jclone(x));cm.add(c)}}return r}
  return jclone(m)}
function fixDoc(p,M){if(p==='inv'&&M&&Array.isArray(M.ins))for(const x of M.ins){if(Array.isArray(x.pxh)){const seen=new Set();x.pxh=x.pxh.filter(h=>Array.isArray(h)&&!seen.has(h[0])&&seen.add(h[0])).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);if(x.pxh.length>500)x.pxh=x.pxh.slice(-500)}}
  return M}
function setDoc(p,d){if(p==='config')S.cfg=normCfg(jclone(d)||{});else if(p==='inv')S.inv=normInv(jclone(d)||{});else if(p==='fichas')S.fd=d&&isObjV(d.f)?jclone(d.f):{};else if(p.startsWith('m-')){if(d)S.months[p.slice(2)]={tx:jclone(d.tx)||{}};else delete S.months[p.slice(2)]}dirty()}
/* Un movimiento solo puede estar en el mes de su fecha y en un solo documento: si la combinación deja uno repetido o fuera de su mes, se arregla. */
function fixMonths(){const seen=new Map(),fix=new Set();for(const ym of Object.keys(S.months).sort()){const tx=S.months[ym].tx||{};for(const id of Object.keys(tx)){const t=tx[id];if(!t||typeof t.d!=='string'){delete tx[id];fix.add('m-'+ym);continue}const ok=t.d.slice(0,7)===ym;const prev=seen.get(id);
    if(prev){const pOk=prev.t.d.slice(0,7)===prev.ym;if(ok&&!pOk){delete S.months[prev.ym].tx[id];fix.add('m-'+prev.ym);seen.set(id,{ym,t})}else{delete tx[id];fix.add('m-'+ym)}continue}

}

/* ---------- periods & calculations ---------- */
function period(off){const s=Math.min(28,Math.max(1,+S.cfg.set.ms||1)),t=new Date();let y=t.getFullYear(),m=t.getMonth();if(t.getDate()<s)m--;m+=off;const st=new Date(y,m,s),en=new Date(y,m+1,s-1),si=iso(st),ei=iso(en);return{s:si,e:ei,off,days:diffDays(si,ei)+1,short:MESC[st.getMonth()]+(s>1?'–'+MESC[en.getMonth()]:''),label:s===1?cap(MES[st.getMonth()])+' '+st.getFullYear():fdate(si)+' – '+fdate(ei)}}
function stats(p){let i=0,g=0,inv=0,n=0;const bc={};for(const t of allTx()){if(t.d<p.s||t.d>p.e)continue;n++;if(t.t==='i')i+=t.a;else if(t.t==='g'){g+=t.a;const c=t.c||'_';bc[c]=(bc[c]||0)+t.a}else if(t.t==='inv')inv+=t.a}return{i,g,inv,net:i-g,n,bc}}
function accEffect(t,id){let v=0;if(t.ac===id){if(t.t==='i'||t.t==='aj'||t.t==='rem')v+=t.a;else v-=t.a}if(t.t==='tr'&&t.to===id)v+=t.a;return v}
function balance(a,upto){upto=upto||today();let b=a.ib||0;for(const t of allTx()){if(t.d>=(a.ibd||'0000')&&t.d<=upto)b+=accEffect(t,a.id)}return b}
const liq=(t,a)=>t==='i'||t==='rem'?a:(t==='g'||t==='inv')?-a:0;
function recDoneMap(){const m={};for(const t of allTx())if(t.rec&&t.rd)m[t.rec+'|'+t.rd]=t;for(const o of S.inv.ops)if(o.rec&&o.rd&&!m[o.rec+'|'+o.rd])m[o.rec+'|'+o.rd]=o;return m}
function occ(r,s,e){const out=[];if(!r.sd)return out;const day=pd(r.sd).getDate(),ev=Math.max(1,+r.ev||1);let k=0,d=r.sd;while(d<=e&&k<3000){if(d>=s&&(!r.ed||d<=r.ed))out.push(d);k++;d=r.f==='w'?addDays(r.sd,7*ev*k):r.f==='y'?addMonths(r.sd,12*ev*k,day):r.f==='q'?addMonths(r.sd,3*ev*k,day):addMonths(r.sd,ev*k,day)}return out}
function nextOcc(r){const t=today();const o=occ(r,t,addDays(t,800));return o[0]||null}
function perMonth(r){const ev=Math.max(1,+r.ev||1);return r.f==='w'?r.a*52/12/ev:r.f==='y'?r.a/12/ev:r.f==='q'?r.a/3/ev:r.a/ev}

  for(const r of S.cfg.rec){if(r.on===false)continue;for(const d of occ(r,p.s,p.e)){const k=r.id+'|'+d,done=dm[k]||null,skip=S.cfg.skip.includes(k);items.push({r,d,k,done,skip,late:!done&&!skip&&d<td})}}

/* subscription detector */
function detectSubs(){
  const td=today(),from=addDays(td,-400),groups={};
  for(const t of allTx()){if(t.t!=='g'||!t.n||t.d<from)continue;const k=normSub(t.n);if(!k)continue;(groups[k]??=[]).push(t)}
  const recKeys=new Set(S.cfg.rec.filter(r=>r.on!==false).map(r=>normSub(r.n)));
  const out=[];
  for(const k in groups){
    if(S.cfg.ignSubs.includes(k)||recKeys.has(k))continue;
    let g=groups[k].filter(t=>!t.rec);if(g.length<2)continue;
    const am=g.map(t=>t.a).sort((a,b)=>a-b),med=am[Math.floor(am.length/2)];
    g=g.filter(t=>Math.abs(t.a-med)<=Math.max(100,med*0.2)).sort((a,b)=>a.d<b.d?-1:1);
    const ds=[...new Set(g.map(t=>t.d))];if(ds.length<2)continue;if(ds.length===2&&g[0].a!==g[g.length-1].a)continue;
    const diffs=[];for(let i=1;i<ds.length;i++)diffs.push(diffDays(ds[i-1],ds[i]));
    const sd=[...diffs].sort((a,b)=>a-b),m=sd[Math.floor(sd.length/2)];
    let f=null;if(m>=5&&m<=9&&ds.length>=3)f='w';else if(m>=25&&m<=36)f='m';else if(m>=84&&m<=98)f='q';else if(m>=350&&m<=380)f='y';if(!f)continue;
    const reg=diffs.filter(x=>Math.abs(x-m)<=Math.max(3,m*0.35)).length/diffs.length;if(reg<0.6)continue;
    const last=g[g.length-1],avg=Math.round(g.reduce((s,t)=>s+t.a,0)/g.length),gap=diffDays(last.d,td);
    const cc={};for(const t of g)if(t.c)cc[t.c]=(cc[t.c]||0)+1;const topC=Object.keys(cc).sort((a,b)=>cc[b]-cc[a])[0]||null;
    out.push({k,name:last.n,n:g.length,avg,f,last,annual:f==='w'?avg*52:f==='m'?avg*12:f==='q'?avg*4:avg,stale:gap>m*2+10,cat:topC,ac:last.ac,ids:g.map(t=>t.id),interval:m})
  }
  return out.sort((a,b)=>b.annual-a.annual)
}

/* --- Precios y participaciones a una fecha (comparten evolución de cartera y patrimonio) --- */
function pxAtD(pts,id,d){const a=pts[id]||[];let v=null,pd0=null;for(const p of a){if(p[0]<=d){v=p[1];pd0=p[0]}else break}if(v==null){if(!a[0])return null;v=a[0][1];pd0=a[0][0]}for(const q of S.inv.ops)if(q.t==='split'&&q.ins===id&&q.d>pd0&&q.d<=d&&q.num>0&&q.den>0)v*=q.den/q.num;return v}
function unitsOp(units,o){if(o.t==='sw'){units[o.ins]=(units[o.ins]||0)-(+o.u);units[o.to]=(units[o.to]||0)+(+o.u2)}else if(o.t==='split'&&o.num>0&&o.den>0)units[o.ins]=(units[o.ins]||0)*o.num/o.den;else if(o.t==='lib')units[o.ins]=(units[o.ins]||0)+(+o.u)}
/* Precios conocidos de cada activo. Si el mismo día hay VL apuntado y precio de operación, manda el VL apuntado (como en pxOf). */
function pricePts(ops){const pts={};for(const x of S.inv.ins){const a=(x.pxh||[]).map(h=>[h[0],h[1],1]);if(x.px)a.push([x.px.d,x.px.v,1]);for(const o of ops){if(o.ins===x.id&&o.pr>0&&(o.t==='buy'||o.t==='sell'||o.t==='sw'))a.push([o.d,o.pr,0]);if(o.t==='sw'&&o.to===x.id&&o.pr2>0)a.push([o.d,o.pr2,0])}a.sort((p,q)=>p[0]<q[0]?-1:p[0]>q[0]?1:p[2]-q[2]);pts[x.id]=a}return pts}
function portAt(dates){const ops=opsSorted(),pts=pricePts(ops),units={},out={},ap={i:0,e:0};let oi=0;for(const d of [...dates].sort()){while(oi<ops.length&&ops[oi].d<=d){const o=ops[oi++],kk=insById(o.ins)?.k==='epsv'?'e':'i';if(o.t==='buy'){units[o.ins]=(units[o.ins]||0)+(+o.u);ap[kk]+=o.a}else if(o.t==='sell'){units[o.ins]=(units[o.ins]||0)-(+o.u);ap[kk]-=o.a}else unitsOp(units,o)}let inv=0,ep=0;for(const id in units)if(units[id]>1e-9){const p=pxAtD(pts,id,d);if(p){const v=units[id]*p*100;if(insById(id)?.k==='epsv')ep+=v;else inv+=v}}out[d]={inv:Math.round(inv),epsv:Math.round(ep),apI:ap.i,apE:ap.e}}return out}

/* ---------- Patrimonio y objetivos (fase 3) ---------- */
const seur0=c=>(c>0?'+':c<0?'−':'')+eur0(Math.abs(c));
const PATC=[['liq','Liquidez','var(--c1)'],['inv','Inversiones','var(--c2)'],['epsv','EPSV','var(--c3)']];
function balAt(a,d){if(d>=(a.ibd||'0000'))return balance(a,d);let b=a.ib||0;for(const t of allTx())if(t.d>d&&t.d<a.ibd)b-=accEffect(t,a.id);return b}
const isRendCat=c=>{const k=normKey(catName(c));return k==='intereses'||k==='dividendos'};
let patCache=null;
/* Las cuentas archivadas también cuentan: su saldo de antes de archivarlas era tuyo, y al vaciarlas con un traspaso el dinero no aparece de la nada (no es rendimiento). */
function patSeries(){const L=S.cfg.accounts.filter(a=>!isInvAcc(a)),I=S.cfg.accounts.filter(isInvAcc);if(!L.length&&!I.length&&!S.inv.ins.length)return null;const td=today(),tx=allTx();let start=null;
  for(const a of L){let f=a.ibd||td;for(const t of tx)if((t.ac===a.id||t.to===a.id)&&t.d<f)f=t.d;if(!start||f>start)start=f}
  if(!L.length)start=opsSorted()[0]?.d||td;if(start>td)start=td;
  const ms=[];let y=+start.slice(0,4),m=+start.slice(5,7);const ty=+td.slice(0,4),tm=+td.slice(5,7);while(y<ty||(y===ty&&m<=tm)){const e=new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);ms.push({ym:`${y}-${String(m).padStart(2,'0')}`,d:e>td?td:e});m++;if(m>12){m=1;y++}}
  const P=portAt(ms.map(x=>x.d)),C=S.inv.ins.length?computeInv():null;
  for(const x of ms){x.liq=L.reduce((s,a)=>s+balAt(a,x.d),0);const pa=P[x.d]||{inv:0,epsv:0,apI:0,apE:0};x.invP=pa.inv;x.inv=pa.inv+I.reduce((s,a)=>s+balAt(a,x.d),0);x.epsv=pa.epsv;x.apI=pa.apI;x.apE=pa.apE}
  const Z=ms[ms.length-1];if(C){Z.invP=C.pos.filter(p=>p.ins.k!=='epsv').reduce((s,p)=>s+p.v,0);Z.inv=Z.invP+I.reduce((s,a)=>s+balance(a),0);Z.epsv=C.pos.filter(p=>p.ins.k==='epsv').reduce((s,p)=>s+p.v,0)}
  for(const x of ms)x.tot=x.liq+x.inv+x.epsv;
  const loose=tx.filter(t=>t.t==='inv'&&!t.op),looseA=loose.reduce((s,t)=>s+t.a,0);
  return{start,ms,cur:Z,loose:loose.length,looseA}}
/* Cambio entre dos fechas: lo que ahorraste (ingresos sin intereses ni dividendos − gastos), ajustes de saldo y el resto, que es lo que rindió tu dinero */
function patSplit(d0,d1,dTot){let sav=0,aj=0,ext=0;const tx=allTx(),lk=new Set();for(const t of tx)if(t.op)lk.add(t.op);
  for(const t of tx){if(t.d<=d0||t.d>d1)continue;if(t.t==='i'&&!isRendCat(t.c))sav+=t.a;else if(t.t==='g')sav-=t.a;else if(t.t==='aj')aj+=accEffect(t,t.ac);else if(!t.op&&t.t==='inv')ext-=t.a;else if(!t.op&&t.t==='rem')ext+=t.a}
  for(const o of S.inv.ops){if(o.d<=d0||o.d>d1||lk.has(o.id))continue;if(o.t==='buy')ext+=o.a;else if(o.t==='sell'||o.t==='der'||o.t==='prima')ext-=o.a-(o.wr||0);else if(o.t==='div')ext-=divNet(o)}
  return{sav,aj,ext,rend:dTot-sav-aj-ext}}
function monthSaving(){const td=today(),tx=allTx();if(!tx.length)return null;const first=tx.reduce((m,t)=>t.d<m?t.d:m,td);let y=+td.slice(0,4),m=+td.slice(5,7);const out=[];for(let k=0;k<3;k++){m--;if(m<1){m=12;y--}const s0=`${y}-${String(m).padStart(2,'0')}-01`,e0=new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);if(e0<first)break;let v=0;for(const t of tx){if(t.d<s0||t.d>e0)continue;if(t.t==='i')v+=t.a;else if(t.t==='g')v-=t.a}out.push(v)}return out.length?Math.round(out.reduce((a,b)=>a+b,0)/out.length):null}
const GSRC=[['all','Todo tu patrimonio'],['liq','Tu liquidez'],['inv','Tus inversiones'],['acc','Una cuenta'],['man','Lo apunto yo']];
function goalCur(g,c){if(!c)return g.src==='man'?(g.sv||0):0;if(g.src==='all')return c.tot;if(g.src==='liq')return c.liq;if(g.src==='inv')return c.inv+c.epsv;if(g.src==='acc'){const a=acc(g.ac);return a?balance(a):0}return g.sv||0}

const DT=[['','Todas'],['buy','Compras'],['sell','Ventas'],['sw','Traspasos'],['div','Dividendos'],['oth','Otros']];
function dOps(){const F=S.df,q=normTxt(F.q);return S.inv.ops.filter(o=>(!F.t||o.t===F.t||(F.t==='oth'&&OTH.includes(o.t)))&&(!F.ins||o.ins===F.ins||o.to===F.ins)&&(!F.y||o.d.slice(0,4)===F.y)&&(!q||normTxt(insName(o.ins)+' '+(insById(o.ins)?.isin||'')+' '+(o.to?insName(o.to):'')+' '+(o.n||'')+' '+OPN[o.t]+' '+opName(o)+' '+(o.mot||[]).map(motName).join(' ')).includes(q))).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0))}
function dList(){const L=dOps();let buy=0,sell=0,dv=0;for(const o of L){if(o.t==='buy')buy+=o.a;else if(o.t==='sell')sell+=o.a;else if(o.t==='div')dv+=divNet(o)}
  let h=`<div class="row sp sm muted"><span>${L.length} ${L.length===1?'operación':'operaciones'}</span><span class="nw">${buy?'Compras '+eur(buy):''}${sell?' · Ventas '+eur(sell):''}${dv?' · Dividendos '+eur(dv):''}</span></div>`;
  if(!L.length)return h+'<div class="card empty">No hay operaciones con estos filtros.</div>';
  const lim=S.dlim||150;let cur='',out='';for(const o of L.slice(0,lim)){const ym=o.d.slice(0,7);if(ym!==cur){cur=ym;const n=L.filter(q=>q.d.slice(0,7)===ym).length;out+=`<div class="day"><span>${MES[+ym.slice(5)-1].replace(/^./,c=>c.toUpperCase())} ${ym.slice(0,4)}</span><span>${n} ${n===1?'operación':'operaciones'}</span></div>`}out+=dRow(o)}
  return h+`<div class="card" style="padding-top:4px;margin-top:10px"><div class="list">${out}</div>${L.length>lim?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" data-act="dmore">Ver ${Math.min(300,L.length-lim)} más</button></div><p class="sm muted" style="text-align:center">Mostrando ${lim} de ${L.length}, las más recientes. Los totales de arriba son de todas.</p>`:''}</div>`}
R_.diario=()=>{if(!S.inv.ops.length)return`<section class="card"><h2>Tu diario de inversión</h2><p>Aquí verás cada compra, venta, traspaso y dividendo: de qué activo, a qué precio, cuántas participaciones, el importe y cuándo. También por qué lo hiciste, si lo apuntas, y cómo ha ido desde entonces.</p><div class="row" style="margin-top:12px"><button class="btn pri" data-act="newop">+ Operación</button><a class="btn" href="#importar">Importar</a></div></section>`;
  const F=S.df,ys=[...new Set(S.inv.ops.map(o=>o.d.slice(0,4)))].sort().reverse();
  return`<div class="stack"><div class="card flat"><input type="search" id="dq" placeholder="Buscar activo, ISIN, nota o motivo" value="${esc(F.q)}" aria-label="Buscar en el diario">
  <div class="chips" style="margin-top:10px">${DT.filter(([k])=>k!=='oth'||S.inv.ops.some(o=>OTH.includes(o.t))).map(([k,l])=>`<button type="button" class="chip" data-act="dft" data-v="${k}" aria-pressed="${F.t===k}">${l}</button>`).join('')}</div>
  <div class="two-in" style="margin-top:10px"><select id="dins" aria-label="Activo"><option value="">Todos los activos</option>${S.inv.ins.map(x=>`<option value="${x.id}" ${F.ins===x.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select><select id="dy" aria-label="Año"><option value="">Todos los años</option>${ys.map(y=>`<option ${F.y===y?'selected':''}>${y}</option>`).join('')}</select></div>
  <div class="row" style="margin-top:10px"><button class="btn" data-act="newop">+ Operación</button></div></div>
  <div id="dlist">${dList()}</div><p class="sm muted">«Desde esta compra» compara su precio con el último VL que tengas apuntado (ajustado si hubo split). Toca una operación para corregirla o añadir el porqué.</p></div>`};
R_.movimientos=p=>{
  const F=S.mf,unc=allTx().filter(t=>!t.c&&(t.t==='g'||t.t==='i')).length;
  let h=`<div class="stack"><div class="card flat"><input type="search" id="mq" placeholder="Buscar concepto, categoría o cuenta" value="${esc(F.q)}" aria-label="Buscar">
  <div class="row" style="margin-top:10px"><div class="seg s5" style="flex:1 1 320px">${[['','Todos'],...TYPES].map(([k,l])=>`<button data-act="mft" data-v="${k}" aria-pressed="${F.t===k}">${l}</button>`).join('')}</div></div>
  <div class="two-in" style="margin-top:10px"><select id="mc" aria-label="Categoría"><option value="">Todas las categorías</option>${S.cfg.cats.map(c=>`<option value="${c.id}" ${F.c===c.id?'selected':''}>${esc(c.n)} (${c.t==='g'?'gasto':'ingreso'})</option>`).join('')}</select><select id="ma" aria-label="Cuenta"><option value="">Todas las cuentas</option>${S.cfg.accounts.map(a=>`<option value="${a.id}" ${F.a===a.id?'selected':''}>${esc(a.n)}</option>`).join('')}</select></div>
  <div class="row" style="margin-top:4px"><label class="check"><input type="checkbox" id="mall" ${F.all?'checked':''}> Todos los meses</label><label class="check"><input type="checkbox" id="munc" ${F.unc?'checked':''}> Solo sin categoría (${unc})</label>${unc?'<button class="link" data-act="catnext">Categorizar uno a uno</button>':''}</div></div>`;

};

R_.presupuesto=p=>{
  const s=stats(p),rows=budgetRows(p,s),td=today(),isCur=td>=p.s&&td<=p.e;
  const tl=rows.reduce((a,b)=>a+b.lim,0),ts=rows.filter(b=>b.lim).reduce((a,b)=>a+b.sp,0),left=isCur?diffDays(td,p.e)+1:0;
  const mx=Math.max(1,...rows.map(b=>Math.max(b.sp,b.lim)));
  let h='<div class="stack">';
  h+=`<section class="card"><div class="row sp" style="align-items:flex-end"><div><div class="lbl">Gastado en categorías con límite</div><div class="hero">${eur0(ts)}<span style="font-size:22px;color:var(--ink3)"> / ${eur0(tl)}</span></div></div>${tl&&isCur?`<div class="rt"><div class="lbl">Puedes gastar al día</div><div style="font:800 22px/1.2 Figtree,sans-serif" class="nw">${eur(Math.max(0,Math.floor((tl-ts)/left)))}</div><div class="sm muted">${left} ${left===1?'día':'días'} restantes</div></div>`:''}</div>
  ${tl?`<div class="scale"><div class="fill ${ts>=tl?'over':ts/tl*100>=S.cfg.set.wp?'warn':''}" style="width:${Math.min(100,ts/tl*100)}%"></div></div>`:'<p class="muted" style="margin-top:8px">Escribe un límite mensual en las categorías que quieras controlar. Las que dejes vacías no tienen límite.</p>'}
  <p class="sm muted" style="margin-top:6px">Aviso al ${S.cfg.set.wp} % y al 100 % (cámbialo en <a href="#ajustes">Ajustes</a>). Los límites valen para todos los meses.</p></section>`;
  h+=`<section class="card"><h2>Límites por categoría</h2><div class="bars">${rows.map(b=>{const w=Math.min(100,b.sp/mx*100),lw=b.lim?Math.min(100,b.lim/mx*100):null;return`<div class="bar"><div class="hd"><b>${esc(b.c.n)}${b.st==='over'?'<span class="tag over">superado</span>':b.st==='warn'?'<span class="tag warn">'+NF0.format(b.pct)+' %</span>':b.lim?'<span class="tag">'+NF0.format(b.pct)+' %</span>':''}</b><span>${eur0(b.sp)}</span></div><div class="row" style="flex-wrap:nowrap;margin-top:4px"><div class="trk" style="flex:1;margin:0"><div class="fill ${b.st==='over'?'over':b.st==='warn'?'warn':''}" style="width:${w}%"></div>${lw!=null?`<div class="mark" style="left:calc(${lw}% - 1px)"></div>`:''}</div><label class="sr" for="bl-${b.c.id}">Límite ${esc(b.c.n)}</label><input id="bl-${b.c.id}" data-bud="${b.c.id}" inputmode="decimal" placeholder="Sin límite" value="${b.lim?typedOf(b.lim):''}" style="width:118px;flex:none;text-align:right" autocomplete="off"></div></div>`}).join('')}</div></section>`;
  return h+'</div>';
};

R_.mas=()=>`<div class="menu">${[['patrimonio','Patrimonio y objetivos','Cuánto tienes en total, cómo ha evolucionado y tus metas de ahorro'],['movimientos','Movimientos','Todos tus gastos, ingresos y traspasos, con buscador y filtros'],['diario','Diario de inversión','Qué compraste o vendiste, de qué activo, a qué precio, cuánto y cuándo, y cómo ha ido desde entonces'],['impuestos','Impuestos','Tu IRPF de Álava: resultado, si tienes que declarar y efecto en tus padres'],['herramientas','Herramientas','Simuladores de fondos y de EPSV y comparador de fondos'],['cuentas','Cuentas','Liquidez, cuentas de inversión y ajustes de saldo'],['recurrentes','Recurrentes','Beca, suscripciones, aportaciones: la base de la previsión'],['suscripciones','Suscripciones','Gastos repetidos que he detectado'],['importar','Importar','Extractos del banco y archivos de Claude'],['exportar','Exportar a Excel','Movimientos, operaciones, posiciones, patrimonio y fiscalidad en un archivo .xlsx'],['categorias','Categorías','Crear, renombrar y archivar'],['ajustes','Ajustes','Mes, avisos, colchón y tema']].map(([h,t,d])=>`<a href="#${h}"><b>${t}</b><span>${d}</span></a>`).join('')}</div>`;

R_.cuentas=()=>{
  const all=S.cfg.accounts,L=all.filter(a=>!a.arch&&!isInvAcc(a)),V=all.filter(a=>!a.arch&&isInvAcc(a)),AR=all.filter(a=>a.arch),C=S.inv.ins.length?computeInv():null,posBy=a=>C?C.pos.filter(p=>p.ins.ac===a.id&&p.u>1e-9).reduce((s,p)=>s+p.v,0):0;
  const tot=L.reduce((s,a)=>s+balance(a),0),mx=Math.max(1,...L.map(a=>Math.abs(balance(a))));
  let h=`<div class="stack"><section class="card"><div class="lbl">Liquidez total</div><div class="hero">${eur(tot)}</div>${L.length?`<div class="bars" style="margin-top:14px">${L.map(a=>{const b=balance(a);return`<div class="bar"><div class="hd"><b>${esc(a.n)}${a.col?'<span class="tag">colchón</span>':''}</b><span>${eur(b)} · ${tot?NF0.format(b/tot*100):0} %</span></div><div class="trk"><div class="fill" style="width:${Math.max(0,b)/mx*100}%"></div></div></div>`}).join('')}</div>`:''}${V.length?`<p class="sm muted" style="margin-top:12px">Además tienes ${eur(V.reduce((s,a)=>s+posBy(a)+balance(a),0))} en cuentas de inversión. <a href="#inversiones">Ver inversiones</a></p>`:''}</section>`;
  const row=a=>{const inv=isInvAcc(a),pv=inv?posBy(a):0,b=balance(a);return`<div class="it" style="cursor:default;flex-wrap:wrap"><span class="tx" style="flex:1 1 180px"><span class="t1">${esc(a.n)}${a.arch?'<span class="tag">archivada</span>':''}${a.col?'<span class="tag">colchón</span>':''}</span><span class="t2" style="white-space:normal">${esc(ACCT[a.k]||'')}${inv?` · posiciones ${eur(pv)} · efectivo ${eur(b)}`:` · saldo inicial ${eur(a.ib||0)} el ${fdate(a.ibd)}`}</span></span><span class="am">${eur(inv?pv+b:b)}</span><span class="row"><button class="link sm" data-act="adjacc" data-id="${a.id}">${inv?'Ajustar efectivo':'Ajustar saldo'}</button><button class="link sm" data-act="editacc" data-id="${a.id}">Editar</button></span></div>`};
  h+=`<section class="card"><div class="row sp"><h2 style="margin:0">Tus cuentas</h2><button class="btn" data-act="newacc">+ Añadir cuenta</button></div>`;
  if(!all.length)h+='<p class="muted" style="margin-top:10px">Añade cada cuenta con el saldo que tiene hoy. Para tus fondos o acciones, crea una «Cuenta de fondos» o «Cuenta de valores» (MyInvestor, tu bróker…).</p>';
  else{if(L.length)h+='<div class="grp">Liquidez</div><div class="list">'+L.map(row).join('')+'</div>';if(V.length)h+='<div class="grp">Inversión</div><div class="list">'+V.map(row).join('')+'</div>';if(AR.length)h+='<div class="grp">Archivadas</div><div class="list">'+AR.map(row).join('')+'</div>'}
  h+='<p class="sm muted" style="margin-top:10px">Las cuentas de liquidez cuentan para el saldo, la previsión y el colchón. Las de fondos y de valores guardan tus posiciones; su efectivo, si lo tienen, se ve en Inversiones. «Ajustar saldo» crea un movimiento de ajuste que no cuenta como gasto ni como ingreso.</p></section></div>';
  return h;
};

R_.recurrentes=()=>{
  const rs=S.cfg.rec;let mi=0,mg=0,minv=0;for(const r of rs){if(r.on===false)continue;const v=perMonth(r);if(r.t==='i')mi+=v;else if(r.t==='g')mg+=v;else if(r.t==='inv')minv+=v}
  let h=`<div class="stack"><div class="kpis"><div class="kpi"><span class="lbl">Ingresos fijos/mes</span><span class="v">${eur0(mi)}</span></div><div class="kpi"><span class="lbl">Gastos fijos/mes</span><span class="v">${eur0(mg)}</span></div><div class="kpi"><span class="lbl">Inversión fija/mes</span><span class="v">${eur0(minv)}</span></div><div class="kpi"><span class="lbl">Gastos fijos/año</span><span class="v">${eur0(mg*12)}</span></div></div>
  <section class="card"><div class="row sp"><h2 style="margin:0">Recurrentes</h2><button class="btn" data-act="newrec">+ Añadir</button></div>`;
  if(!rs.length)h+='<p class="muted" style="margin-top:10px">Añade lo que se repite: tu beca o nómina, suscripciones, la aportación mensual a tus fondos… Con esto la app calcula el saldo previsto a fin de mes.</p>';
  else h+='<div class="list" style="margin-top:6px">'+rs.map(r=>{const nx=nextOcc(r);return`<button class="it" data-act="editrec" data-id="${r.id}"><span class="ty ${r.t}">${{g:'−',i:'+',tr:'⇄',inv:'↗'}[r.t]}</span><span class="tx"><span class="t1">${esc(r.n)}${r.on===false?'<span class="tag">pausado</span>':''}</span><span class="t2">${cap(FREQ[r.f]||'mensual')}${+r.ev>1?' (cada '+r.ev+')':''} · ${r.t==='tr'?accName(r.ac)+' → '+accName(r.to):accName(r.ac)}${nx&&r.on!==false?' · próximo '+fdate(nx):''}</span></span><span class="am ${r.t}">${r.t==='tr'?eur(r.a):seur(liq(r.t,r.a))}</span></button>`}).join('')+'</div>';
  return h+'</section></div>';
};

R_.suscripciones=()=>{
  const ds=detectSubs(),rs=S.cfg.rec.filter(r=>r.t==='g'&&r.on!==false);
  let h=`<div class="stack"><section class="card"><h2>Detectadas en tus movimientos</h2><p class="sm muted">Busco gastos con el mismo concepto e importe parecido que se repiten cada semana, mes, trimestre o año. Mira el último año de movimientos con concepto.</p>`;
  if(!ds.length)h+='<div class="empty">No he encontrado gastos repetidos todavía. Cuantos más movimientos tengas (importa tus extractos), mejor funciona.</div>';
  else h+='<div class="list">'+ds.map((d,i)=>`<div class="it" style="cursor:default;flex-wrap:wrap"><span class="tx" style="flex:1 1 200px"><span class="t1">${esc(d.name)}${d.stale?'<span class="tag">¿cancelada?</span>':''}</span><span class="t2">${cap(FREQ[d.f])} · ${d.n} cargos · último ${fdate(d.last.d)} · ${eur0(d.annual)}/año</span></span><span class="am">${eur(d.avg)}</span><span class="row"><button class="link sm" data-act="sub2rec" data-i="${i}">Convertir en recurrente</button><button class="link sm" data-act="subign" data-k="${esc(d.k)}" style="color:var(--ink3)">Ignorar</button></span></div>`).join('')+'</div>';
  h+='</section>';

  h+=`<section class="card"><h2>Gastos recurrentes activos</h2>${rs.length?`<div class="list">${rs.map(r=>`<button class="it" data-act="editrec" data-id="${r.id}"><span class="tx"><span class="t1">${esc(r.n)}</span><span class="t2">${cap(FREQ[r.f]||'mensual')} · ${eur0(perMonth(r)*12)}/año</span></span><span class="am">${eur(r.a)}</span></button>`).join('')}</div><p style="margin-top:10px"><b>${eur(tot)}</b> al mes · <b>${eur0(tot*12)}</b> al año</p>`:'<p class="muted">Aún no tienes gastos recurrentes.</p>'}${S.cfg.ignSubs.length?`<button class="link sm" data-act="subunign">Volver a mostrar ${S.cfg.ignSubs.length} ignorados</button>`:''}</section></div>`;
  return h;
};

R_.categorias=()=>{
  const used={};for(const t of allTx())if(t.c)used[t.c]=(used[t.c]||0)+1;
  const block=(tt,title)=>`<section class="card"><div class="row sp"><h2 style="margin:0">${title}</h2><button class="btn" data-act="newcat" data-t="${tt}">+ Añadir</button></div><div class="list" style="margin-top:6px">${S.cfg.cats.filter(c=>c.t===tt).map(c=>`<div class="it" style="cursor:default"><span class="tx"><span class="t1">${esc(c.n)}${c.arch?'<span class="tag">archivada</span>':''}</span><span class="t2">${plu(used[c.id]||0,'movimiento','movimientos')}${S.cfg.budgets[c.id]?' · límite '+eur0(S.cfg.budgets[c.id]):''}</span></span><button class="link sm" data-act="rencat" data-id="${c.id}">Renombrar</button><button class="link sm" data-act="archcat" data-id="${c.id}">${c.arch?'Recuperar':'Archivar'}</button></div>`).join('')}</div></section>`;
  return`<div class="stack">${block('g','Gastos')}${block('i','Ingresos')}<p class="sm muted">Archivar oculta la categoría al apuntar, pero conserva sus movimientos.</p></div>`;
};

R_.ajustes=()=>{
  const st=S.cfg.set;let th='auto';try{th=localStorage.getItem('mf-theme')||'auto'}catch(e){}
  return`<div class="stack"><section class="card"><h2>Mes</h2><label class="fl"><span>El mes empieza el día</span><select id="s-ms">${Array.from({length:28},(_,i)=>`<option value="${i+1}" ${+st.ms===i+1?'selected':''}>${i+1}${i===0?' (mes natural: del 1 al último día)':''}</option>`).join('')}</select></label><p class="sm muted" style="margin-top:8px">Si cobras el día 25, por ejemplo, puedes hacer que cada «mes» vaya del 25 al 24 para que el presupuesto empiece con cada cobro. Por defecto es el mes natural.</p></section>
  <section class="card"><h2>Avisos de presupuesto</h2><label class="fl"><span>Avisarme al llegar al (%)</span><input id="s-wp" inputmode="numeric" value="${st.wp}"></label><p class="sm muted" style="margin-top:8px">También aviso al superar el 100 %. Los avisos se ven en la app (no hay notificaciones en el móvil).</p></section>
  <section class="card"><h2>Margen de seguridad</h2><div class="seg s3" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button data-act="srm" data-v="auto" aria-pressed="${st.rm!=='manual'}">Gasto medio real</button><button data-act="srm" data-v="manual" aria-pressed="${st.rm==='manual'}">Gasto fijo</button></div>
  <label class="fl"><span>Gasto mensual de referencia (€) ${st.rm==='manual'?'':'— se usa mientras no haya meses completos'}</span><input id="s-rv" inputmode="decimal" placeholder="Por ejemplo 100" value="${st.rv?typedOf(st.rv):''}"></label>
  <label class="fl"><span>Objetivo en meses (opcional)</span><input id="s-ct" inputmode="decimal" placeholder="Sin objetivo" value="${st.ct||''}"></label>
  <p class="sm muted" style="margin-top:8px">«Gasto medio real» usa la media de los últimos 3 meses completos con movimientos. Qué cuentas forman el colchón se marca en <a href="#cuentas">Cuentas</a>.</p></section>
  <section class="card"><h2>Apuntar rápido</h2><label class="fl"><span>Cuenta por defecto</span><select id="s-da"><option value="">La primera de la lista</option>${activeAccs().map(a=>`<option value="${a.id}" ${st.da===a.id?'selected':''}>${esc(a.n)}</option>`).join('')}</select></label><p class="sm muted" style="margin-top:8px">En el ordenador, pulsa la tecla N para apuntar un movimiento.</p></section>

function applyMapping(){

  if(!saved){const body0=I.rows.slice(I.hr+1,I.hr+41),nc=Math.max(...I.rows.slice(I.hr,I.hr+41).map(r=>r.length));const frac=(i,fn)=>{const v=body0.map(r=>r[i]).filter(x=>String(x??'').trim()!=='');return v.length?v.filter(fn).length/v.length:0};const isD=x=>!!parseDateCell(x,'dmy')||!!parseDateCell(x,'mdy');const isA=x=>typeof x==='number'?Math.abs(x)<1e7&&!(x>20000&&x<80000&&Number.isInteger(x)):/^\s*[-−(]?\s*[\d.,]+\s*(€|eur)?\s*[-)]?\s*$/i.test(String(x))&&/[.,]\d{1,2}\s*(€|eur)?\s*[-)]?\s*$/i.test(String(x));

  I.m={date:g.date??-1,concept:g.concept??-1,amount:g.amount??-1,debit:g.debit??-1,credit:g.credit??-1,mode:g.mode||'one',inv:!!g.inv,ac:saved?.ac&&acc(saved.ac)?saved.ac:(S.cfg.set.da||activeAccs()[0]?.id||'')};

function computeImp(){

function openAcc(id,preset){const a=id?acc(id):null;FA=a?{...a}:{id:null,n:'',k:'c',ib:0,ibd:today(),col:false,...(preset||{})};openSheet(`<h2>${a?'Editar cuenta':'Nueva cuenta'}</h2>
  <label class="fl"><span>Nombre</span><input id="a-n" value="${esc(FA.n)}" placeholder="Por ejemplo «Mi banco»" maxlength="40"></label>
  <label class="fl"><span>Tipo</span><select id="a-k">${Object.entries(ACCT).map(([k,l])=>`<option value="${k}" ${FA.k===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <div class="two-in"><label class="fl"><span id="a-iblab">${isInvAcc(FA)?'Efectivo inicial (€)':'Saldo inicial (€)'}</span><input id="a-ib" inputmode="decimal" value="${a?typedOf(FA.ib):''}" placeholder="0,00"></label><label class="fl"><span>A fecha de</span><input type="date" id="a-d" value="${FA.ibd}"></label></div>
  <p class="sm muted" style="margin-top:6px">El saldo que tenía la cuenta al empezar ese día. Se suman los movimientos desde esa fecha.</p>
  <label class="check" id="a-colrow" ${isInvAcc(FA)?'hidden':''}><input type="checkbox" id="a-col" ${FA.col?'checked':''}> Cuenta como colchón de emergencia</label>
  ${a?`<label class="check"><input type="checkbox" id="a-arch" ${FA.arch?'checked':''}> Archivada (no suma en la liquidez; su historial sigue contando en el patrimonio)</label>`:''}
  <div class="err" id="a-err"></div>
  <div class="acts">${a?'<button class="ghost danger" data-act="delacc">Borrar</button>':''}<button class="pri" data-act="saveacc">Guardar</button></div>`,'acc');if(!a)$('#a-n').focus()}
function saveAcc(){const n=$('#a-n').value.trim();if(!n){$('#a-err').textContent='Ponle un nombre.';return}const ib=parseTyped($('#a-ib').value)||0;const k=$('#a-k').value,o={...FA,n,k,ib,ibd:$('#a-d').value||today(),col:k==='f'||k==='v'?false:$('#a-col').checked};const ar=$('#a-arch');if(ar)o.arch=ar.checked;if(FA.id){const i=S.cfg.accounts.findIndex(x=>x.id===FA.id);S.cfg.accounts[i]=o}else{o.id='a'+newId();S.cfg.accounts.push(o)}save('config');closeSheet();render();toast('Cuenta guardada.')}
function delAcc(){const used=allTx().some(t=>t.ac===FA.id||t.to===FA.id);const b=$('[data-act=delacc]');if(used){$('#a-err').textContent='Esta cuenta tiene movimientos. Puedes archivarla en lugar de borrarla.';return}if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Toca otra vez para borrar';return}S.cfg.accounts=S.cfg.accounts.filter(a=>a.id!==FA.id);save('config');closeSheet();render();toast('Cuenta borrada.')}
function openAdj(id){const a=acc(id);if(!a)return;const b=balance(a);FA={id};openSheet(`<h2>Ajustar saldo</h2><p><b>${esc(a.n)}</b>: la app calcula <b>${eur(b)}</b>.</p><label class="fl"><span>Saldo real hoy (€)</span><input id="j-v" inputmode="decimal" placeholder="${typedOf(b)}"></label><div class="err" id="j-err"></div><div class="acts"><button class="pri" data-act="saveadj">Ajustar</button></div>`,'adj');$('#j-v').focus()}
function saveAdj(){const a=acc(FA.id),v=parseTyped($('#j-v').value);if(v==null){$('#j-err').textContent='Escribe el saldo real.';return}const diff=v-balance(a);if(!diff){closeSheet();toast('El saldo ya coincide.');return}const t={id:newId(),t:'aj',d:today(),a:diff,n:'Ajuste de saldo',ac:a.id,ts:Date.now()};save(putTx(t));closeSheet();render();toast(`Ajuste de ${seur(diff)} en ${a.n}.`,()=>{save(delTx(t.id));render()})}
function openRec(id,pre){const r=id?S.cfg.rec.find(x=>x.id===id):null;FR=r?{...r}:{id:null,n:'',t:'g',a:0,c:null,ac:S.cfg.set.da||activeAccs()[0]?.id||'',to:'',f:'m',ev:1,sd:today(),ed:'',on:true,...(pre||{})};
  openSheet(`<h2>${r?'Editar recurrente':'Nuevo recurrente'}</h2>
  <div class="seg">${TYPES.map(([k,l])=>`<button type="button" data-act="rtype" data-v="${k}" aria-pressed="${FR.t===k}">${l}</button>`).join('')}</div>
  <label class="fl"><span>Nombre</span><input id="r-n" value="${esc(FR.n)}" placeholder="Por ejemplo «Beca» o «Spotify»" maxlength="80"></label>
  <label class="fl"><span>Importe (€)</span><input id="r-a" inputmode="decimal" value="${FR.a?typedOf(FR.a):''}" placeholder="0,00"></label>
  <div id="r-dyn"></div>
  <div class="two-in"><label class="fl"><span>Frecuencia</span><select id="r-f">${Object.entries(FREQ).map(([k,l])=>`<option value="${k}" ${FR.f===k?'selected':''}>${cap(l)}</option>`).join('')}</select></label><label class="fl"><span>Cada</span><select id="r-ev">${[1,2,3,4,6].map(n=>`<option value="${n}" ${+FR.ev===n?'selected':''}>${n===1?'Cada periodo':'Cada '+n}</option>`).join('')}</select></label></div>
  <div class="two-in"><label class="fl"><span>Primera fecha</span><input type="date" id="r-sd" value="${FR.sd}"></label><label class="fl"><span>Hasta (opcional)</span><input type="date" id="r-ed" value="${FR.ed||''}"></label></div>
  ${r?`<label class="check"><input type="checkbox" id="r-on" ${FR.on!==false?'checked':''}> Activo</label>`:''}
  <div class="err" id="r-err"></div>
  <div class="acts">${r?'<button class="ghost danger" data-act="delrec">Borrar</button>':''}<button class="pri" data-act="saverec">Guardar</button></div>`,'rec');renderRdyn();if(!r&&!pre)$('#r-n').focus()}
function renderRdyn(){const el=$('#r-dyn');if(!el)return;const accs=activeAccs();const accSel=(id,val,lab)=>`<label class="fl"><span>${lab}</span><select id="${id}"><option value="">Sin cuenta</option>${accs.map(a=>`<option value="${a.id}" ${val===a.id?'selected':''}>${esc(a.n)}</option>`).join('')}</select></label>`;let h='';if(FR.t==='g'||FR.t==='i')h+=`<label class="fl"><span>Categoría</span><select id="r-c"><option value="">Sin categoría</option>${S.cfg.cats.filter(c=>c.t===FR.t&&!c.arch).map(c=>`<option value="${c.id}" ${FR.c===c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select></label>`+accSel('r-ac',FR.ac,'Cuenta');else if(FR.t==='tr')h+=`<div class="two-in">${accSel('r-ac',FR.ac,'Desde')}${accSel('r-to',FR.to,'Hacia')}</div>`;else{h+=accSel('r-ac',FR.ac,'Sale de la cuenta');if(S.inv.ins.length)h+=`<label class="fl"><span>Fondo o activo (opcional)</span><select id="r-ins"><option value="">Ninguno</option>${S.inv.ins.map(x=>`<option value="${x.id}" ${FR.ins===x.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select></label><p class="sm muted" style="margin-top:6px">Si eliges el fondo, al registrar la aportación se apunta también la compra en tus inversiones.</p>`}el.innerHTML=h}
function readR(){const g=id=>$(id)?.value;FR.n=(g('#r-n')||'').trim();FR.a=Math.abs(parseTyped(g('#r-a'))||0);if($('#r-c'))FR.c=g('#r-c')||null;if($('#r-ac'))FR.ac=g('#r-ac')||'';if($('#r-to'))FR.to=g('#r-to')||'';FR.f=g('#r-f')||'m';if($('#r-ins'))FR.ins=g('#r-ins')||'';FR.ev=+g('#r-ev')||1;FR.sd=g('#r-sd')||today();FR.ed=g('#r-ed')||'';if($('#r-on'))FR.on=$('#r-on').checked}
function saveRec(){readR();const e=$('#r-err');if(!FR.n){e.textContent='Ponle un nombre.';return}if(!FR.a){e.textContent='Escribe el importe.';return}if(FR.t==='tr'&&(!FR.ac||!FR.to||FR.ac===FR.to)){e.textContent='Elige dos cuentas distintas.';return}const o={...FR};if(o.t!=='g'&&o.t!=='i')o.c=null;if(o.t!=='tr')delete o.to;if(o.id){const i=S.cfg.rec.findIndex(x=>x.id===o.id);S.cfg.rec[i]=o}else{o.id='r'+newId();S.cfg.rec.push(o)}save('config');closeSheet();render();toast('Recurrente guardado.')}
function delRec(){const b=$('[data-act=delrec]');if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Toca otra vez para borrar';return}S.cfg.rec=S.cfg.rec.filter(r=>r.id!==FR.id);save('config');closeSheet();render();toast('Recurrente borrado. Los movimientos ya registrados se mantienen.')}
function openCatName(id,t){const c=id?cat(id):null;openSheet(`<h2>${c?'Renombrar categoría':'Nueva categoría de '+(t==='g'?'gasto':'ingreso')}</h2><label class="fl"><span>Nombre</span><input id="c-n" value="${esc(c?.n||'')}" maxlength="40"></label><div class="err" id="c-err"></div><div class="acts"><button class="pri" data-act="savecat" data-id="${id||''}" data-t="${t||c?.t}">Guardar</button></div>`,'cat2');$('#c-n').focus()}
function saveCat(el){const n=$('#c-n').value.trim();if(!n){$('#c-err').textContent='Ponle un nombre.';return}const id=el.dataset.id,t=el.dataset.t;if(S.cfg.cats.some(c=>c.t===t&&c.id!==id&&normKey(c.n)===normKey(n))){$('#c-err').textContent='Ya existe una categoría con ese nombre.';return}if(id){cat(id).n=n}else S.cfg.cats.push({id:t+newId(),n,t});save('config');closeSheet();render()}

/* ---------- figures ---------- */
const ROs=[];
function mountFigs(root,store){root=root||D;store=store||ROs;while(store.length)store.pop().disconnect();for(const el of $$('[data-fig]',root)){const fn=FIG[el.dataset.fig];if(!fn)continue;const ro=new ResizeObserver(()=>{if(el.clientWidth<40||!el.isConnected)return;try{fn(el)}catch(e){console.error(e)}});ro.observe(el);store.push(ro)}}
const FIG={};FIG.pat=el=>figPat(el);
function niceMax(v){if(v<=0)return 100;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function tipAt(el,html,x,y){let t=el.querySelector('.tip');if(!t){t=D.createElement('div');t.className='tip';el.appendChild(t)}if(!html){t.style.display='none';return}t.innerHTML=html;t.style.display='block';const W=el.clientWidth,tw=t.offsetWidth;t.style.left=Math.max(0,Math.min(W-tw,x-tw/2))+'px';t.style.top=Math.max(0,y-t.offsetHeight-12)+'px'}
const cssv=n=>getComputedStyle(D.documentElement).getPropertyValue(n).trim();
FIG.metro=el=>{
  const p=period(S.po),f=forecast(p),W=el.clientWidth,H=el.clientHeight,narrow=W<520,mx=narrow?14:22,y=H/2+6;
  const X=d=>mx+(diffDays(p.s,d)/Math.max(1,p.days-1))*(W-2*mx);
  const td=f.td,tx=td<p.s?mx:td>p.e?W-mx:X(td);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Línea del mes con los movimientos previstos">`;
  s+=`<line x1="${mx}" y1="${y}" x2="${W-mx}" y2="${y}" stroke="var(--track)" stroke-width="8" stroke-linecap="round"/>`;
  if(tx>mx)s+=`<line x1="${mx}" y1="${y}" x2="${tx}" y2="${y}" stroke="var(--blue)" stroke-width="8" stroke-linecap="round"/>`;
  // week ticks
  for(let d=p.s;d<=p.e;d=addDays(d,7)){const x=X(d);s+=`<line x1="${x}" y1="${y+9}" x2="${x}" y2="${y+14}" stroke="var(--ink3)" stroke-width="1"/>`}
  s+=`<text x="${mx}" y="${H-4}" font-size="13" fill="var(--ink3)">${fdate(p.s)}</text><text x="${W-mx}" y="${H-4}" font-size="13" fill="var(--ink3)" text-anchor="end">${fdate(p.e)}</text>`;
  if(td>=p.s&&td<=p.e){const lx=Math.max(mx+62,Math.min(W-mx-62,tx));s+=`<line x1="${tx}" y1="${y-14}" x2="${tx}" y2="${y+14}" stroke="var(--ink)" stroke-width="2"/><text x="${lx}" y="${H-4}" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="middle">hoy</text>`}
  // stations
  const lastX={up:-1e9,dn:-1e9},LW=narrow?62:96;let side='up',hidden=0;
  f.items.forEach(it=>{const x=X(it.d),col=it.r.t==='i'?'var(--blue)':it.r.t==='g'?'var(--red)':it.r.t==='inv'?'var(--green)':'var(--ink3)';const filled=it.done;s+=`<circle cx="${x}" cy="${y}" r="7.5" fill="${filled?col:'var(--bg)'}" stroke="${it.late?'var(--amber)':col}" stroke-width="3.5"/>`;
    let sd=side;if(x-lastX[sd]<LW){sd=sd==='up'?'dn':'up';if(x-lastX[sd]<LW)sd=null}
    if(sd){lastX[sd]=x;const anc=x<mx+LW/2?'start':x>W-mx-LW/2?'end':'middle';const amt=(it.r.t==='i'?'+':it.r.t==='tr'?'':'−')+eur0(it.r.a);const nm=it.r.n.length>(narrow?9:14)?it.r.n.slice(0,narrow?8:13)+'…':it.r.n;
      if(sd==='up')s+=`<text x="${x}" y="${y-30}" font-size="13" fill="var(--ink2)" text-anchor="${anc}">${esc(nm)}</text><text x="${x}" y="${y-15}" font-size="13" font-weight="800" fill="var(--ink)" text-anchor="${anc}">${amt}</text>`;
      else s+=`<text x="${x}" y="${y+28}" font-size="13" font-weight="800" fill="var(--ink)" text-anchor="${anc}">${amt}</text><text x="${x}" y="${y+43}" font-size="13" fill="var(--ink2)" text-anchor="${anc}">${esc(nm)}</text>`;
      side=sd==='up'?'dn':'up'}else hidden++});
  s+='</svg>';el.innerHTML=s;
};
FIG.cum=el=>{
  const p=period(S.po),pp=period(S.po-1),td=today(),W=el.clientWidth,H=el.clientHeight,narrow=W<520;
  const series=(per,stop)=>{const n=per.days,arr=new Array(n).fill(0);for(const t of allTx())if(t.t==='g'&&t.d>=per.s&&t.d<=per.e){const i=diffDays(per.s,t.d);if(i>=0&&i<n)arr[i]+=t.a}let c=0;const out=[];const lim=stop?Math.min(n,diffDays(per.s,stop)+1):n;for(let i=0;i<lim;i++){c+=arr[i];out.push(c)}return out};
  const cur=p.s>td?[]:series(p,td>=p.s&&td<=p.e?td:null),prev=series(pp,null);
  const tl=S.cfg.cats.filter(c=>c.t==='g').reduce((a,c)=>a+(S.cfg.budgets[c.id]||0),0);
  const N=Math.max(p.days,pp.days),ymax=niceMax(Math.max(1,...cur,...prev,tl)*1.05);
  const ml=narrow?40:52,mr=12,mt=10,mb=26,iw=W-ml-mr,ih=H-mt-mb;
  const X=i=>ml+i/(N-1)*iw,Y=v=>mt+ih-v/ymax*ih;
  const lg=$('#lg-cum');if(lg)lg.innerHTML=`<span><i style="background:var(--red)"></i>${p.off===0?'Este mes':esc(p.short)}: <b>${eur0(cur[cur.length-1]||0)}</b></span><span><i style="background:var(--ink3)"></i>${esc(pp.short)}: <b>${eur0(prev[prev.length-1]||0)}</b></span>${tl?`<span><i style="background:var(--ink2);height:0;border-top:2px dashed var(--ink2)"></i>Presupuesto: <b>${eur0(tl)}</b></span>`:''}`;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto acumulado del periodo frente al anterior">`;
  for(let k=0;k<=4;k++){const v=ymax*k/4,yy=Y(v);s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;if(!narrow||k%2===0)s+=`<text x="${ml-8}" y="${yy+4}" font-size="13" fill="var(--ink3)" text-anchor="end">${NF0.format(v/100)}</text>`}
  [1,Math.round(N/2),N].forEach(d=>{s+=`<text x="${X(d-1)}" y="${H-6}" font-size="13" fill="var(--ink3)" text-anchor="${d===1?'start':d===N?'end':'middle'}">día ${d}</text>`});
  if(tl)s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(N-1)}" y2="${Y(tl)}" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  if(prev.length)s+=`<path d="${path(prev)}" fill="none" stroke="var(--ink3)" stroke-width="2" stroke-linejoin="round"/>`;
  if(cur.length){s+=`<path d="${path(cur)}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>`;const li=cur.length-1;s+=`<circle cx="${X(li)}" cy="${Y(cur[li])}" r="4.5" fill="var(--red)" stroke="var(--panel)" stroke-width="2"/>`}
  s+=`<line class="cxl" x1="0" x2="0" y1="${mt}" y2="${mt+ih}" stroke="var(--ink3)" stroke-width="1" visibility="hidden"/><rect x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML=s;const svg=el.querySelector('svg'),cx=svg.querySelector('.cxl');
  const mv=e=>{const r=svg.getBoundingClientRect(),x=e.clientX-r.left;if(x<ml||x>W-mr){cx.setAttribute('visibility','hidden');tipAt(el,'');return}const i=Math.max(0,Math.min(N-1,Math.round((x-ml)/iw*(N-1))));cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.setAttribute('visibility','visible');tipAt(el,`<b>Día ${i+1}</b><br>${p.off===0?'Este mes':esc(p.short)}: ${cur[i]!=null?eur(cur[i]):'—'}<br>${esc(pp.short)}: ${prev[i]!=null?eur(prev[i]):'—'}${tl?'<br>Ritmo presupuesto: '+eur(Math.round(tl*i/(N-1))):''}`,X(i),Y(Math.max(cur[i]||0,prev[i]||0)))};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',()=>{cx.setAttribute('visibility','hidden');tipAt(el,'')});
};
FIG.six=el=>{
  const W=el.clientWidth,H=el.clientHeight,narrow=W<520,ps=[];for(let o=S.po-5;o<=S.po;o++){const p=period(o);ps.push({p,s:stats(p)})}
  const ymax=niceMax(Math.max(1,...ps.map(x=>Math.max(x.s.i,x.s.g)))*1.05),ml=narrow?40:52,mr=8,mt=10,mb=26,iw=W-ml-mr,ih=H-mt-mb,gw=iw/ps.length,bw=Math.min(28,(gw-14)/2);
  const Y=v=>mt+ih-v/ymax*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos seis meses">`;
  for(let k=0;k<=4;k++){const v=ymax*k/4,yy=Y(v);s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;if(!narrow||k%2===0)s+=`<text x="${ml-8}" y="${yy+4}" font-size="13" fill="var(--ink3)" text-anchor="end">${NF0.format(v/100)}</text>`}
  const bar=(x,v,col)=>{if(v<=0)return'';const y0=Y(0),y1=Y(v),h=y0-y1,r=Math.min(4,h,bw/2);return`<path d="M${x} ${y0}V${y1+r}Q${x} ${y1} ${x+r} ${y1}H${x+bw-r}Q${x+bw} ${y1} ${x+bw} ${y1+r}V${y0}Z" fill="${col}"/>`};
  ps.forEach((x,i)=>{const cx=ml+gw*i+gw/2;s+=bar(cx-bw-1,x.s.i,'var(--blue)')+bar(cx+1,x.s.g,'var(--red)');s+=`<text x="${cx}" y="${H-6}" font-size="13" fill="${x.p.off===S.po?'var(--ink)':'var(--ink3)'}" font-weight="${x.p.off===S.po?700:400}" text-anchor="middle">${esc(x.p.short.split('–')[0])}</text>`});
  s+=`<rect id="hl" x="0" y="${mt}" width="${gw}" height="${ih}" fill="var(--ink)" opacity="0" rx="6"/></svg>`;
  el.innerHTML=s;const svg=el.querySelector('svg'),hl=svg.querySelector('#hl');
  const mv=e=>{const r=svg.getBoundingClientRect(),x=e.clientX-r.left,i=Math.floor((x-ml)/gw);if(i<0||i>=ps.length){hl.setAttribute('opacity',0);tipAt(el,'');return}const q=ps[i];hl.setAttribute('x',ml+gw*i);hl.setAttribute('opacity',.06);tipAt(el,`<b>${esc(q.p.label)}</b><br>Ingresos: ${eur(q.s.i)}<br>Gastos: ${eur(q.s.g)}<br>Ahorro: ${seur(q.s.net)}`,ml+gw*i+gw/2,Y(Math.max(q.s.i,q.s.g)))};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',()=>{hl.setAttribute('opacity',0);tipAt(el,'')});
};

/* ---------- investments (fase 2) ---------- */
const INVK={fondo:'Fondo',etf:'ETF',accion:'Acción',epsv:'EPSV',otro:'Otro'};
const CLS={rv:'Renta variable',rf:'Renta fija',mon:'Monetario',mix:'Mixto',alt:'Alternativos y materias primas',liq:'Liquidez'};
const REG={global:'Global (sin desglose)',eeuu:'EE. UU.',europa:'Europa',espana:'España',japon:'Japón',asia:'Asia-Pacífico (sin Japón)',emerg:'Emergentes',otra:'Otras',liq:'Liquidez'};
/* Escala del ahorro de Álava desde 1/1/2026 (art. 76 NF 33/2013, redacción NF 3/2025) */
const SAV=[[7500,19],[15000,20],[30000,22],[50000,24],[90000,25.5],[120000,26],[240000,26.5],[300000,27],[Infinity,28]];
function taxSav(c){if(c<=0)return 0;let rest=c/100,prev=0,tax=0;for(const[lim,r]of SAV){const span=Math.min(rest,lim-prev);if(span<=0)break;tax+=span*r/100;rest-=span;prev=lim;if(rest<=0)break}return Math.round(tax*100)}
/* Coeficientes de actualización del valor de adquisición (art. 45.2 NF 33/2013), por año de transmisión.

function vlRet(id){const x=insById(id),td=today();if(!x)return null;const now=pxOf(x,td);if(!now)return null;const pts=(pricePts(opsSorted())[id]||[]).filter(q=>q[0]<=td);

  const d1=addDays(td,-365),b1=at(d1);if(b1&&f&&f.d<=d1&&b1[0]<now.d)out.y1={d:b1[0],v:b1[1],r:R(b1[0],b1[1]),stale:diffDays(b1[0],d1)>20};
  let pv=null;for(const q of pts)if(q[0]<now.d)pv=q;if(pv&&(!out.first||pv[0]>out.first.d||!out.ytd))out.prev={d:pv[0],v:pv[1],r:R(pv[0],pv[1])};

/* Participaciones homogéneas «recompradas»: las que siguen en cartera tras la venta con fecha de adquisición en la ventana previa, más las compras o traspasos de entrada en la ventana posterior. */
function washUnits(r,C){const m=washMonths(r.ins),from=addMonths(r.d,-m),to=addMonths(r.d,m);let w=0;for(const l of r.after||[])if(l.d>=from&&l.d<=r.d)w+=l.u;const rts=r.op?.ts??Infinity,later=o=>o.d>r.d||(o.d===r.d&&(o.ts||0)>rts);for(const o of C.ops){if(o.id===r.op?.id)continue;if(o.t==='buy'&&o.ins===r.ins&&o.d<=to&&later(o))w+=+o.u;else if(o.t==='sw'&&o.to===r.ins&&o.d<=to&&later(o))w+=+o.u2}return{w,m,from,to}}

function fiscalYears(C){
  const real=C.real.filter(r=>!r.epsv).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0),pend={};
  for(const r of real){r.def=0;r.intDef=0;if(r.gainAdj<0){const W=washUnits(r,C),f=r.u>0?Math.min(1,W.w/r.u):0;if(f>1e-9){r.def=r.gainAdj*f;r.washM=W.m}}}

  for(const x of ev){if(x.k==='w'){const e=x.e,p=pend[e.from]||0;if(p<0&&e.heldBefore>0){const mv=p*Math.min(1,e.u/e.heldBefore);pend[e.from]=p-mv;pend[e.to]=(pend[e.to]||0)+mv}continue}const r=x.r,p=pend[r.ins]||0;if(p<0&&r.heldBefore>0){const amt=p*Math.min(1,r.u/r.heldBefore);r.intDef=amt;pend[r.ins]=p-amt}if(r.def<0)pend[r.ins]=(pend[r.ins]||0)+r.def;r.comp=r.gainAdj-r.def+r.intDef}
  const by={},nb=y=>by[y]??={y,n:0,g:0,l:0,def:0,rows:[],wrS:0,der:[],gDer:0,wrD:0};for(const r of real){const y=+r.d.slice(0,4),b=nb(y);b.n++;if(r.comp>=0)b.g+=r.comp;else b.l+=r.comp;b.def+=r.def;b.rows.push(r);b.wrS+=r.op.wr||0}
  for(const o of C.ops)if(o.t==='der'&&!isEp(o.ins)){const b=nb(+o.d.slice(0,4));b.der.push(o);b.g+=o.a;b.gDer+=o.a;b.wrD+=o.wr||0}

  for(const q of C.prim||[]){if(isEp(q.ins))continue;const r=nr(+q.d.slice(0,4));r.pex+=q.ex;r.wrP+=q.op.wr||0;r.prim.push(q)}

 escala del ahorro de 2026: 19 % hasta 7.500 €, 20 % hasta 15.000 €, 22 % hasta 30.000 €, 24 % hasta 50.000 € y así hasta el 28 % (art. 76). La minoración de cuota de 1.615 € solo reduce la cuota de la base general, no la del ahorro (art. 74 y 77). La estimación incluye tus ventas y los dividendos que registres; no incluye intereses de cuentas ni otras rentas del ahorro. Revisa la escala y los coeficientes cada enero.<br><b>Dividendos:</b> son rendimiento del capital mobiliario y van a la base del ahorro, pero se compensan aparte de las ganancias y pérdidas (art. 66). Los de acciones están exentos hasta 1.500 € al año en total; no lo están los de fondos ni ETFs, ni los de acciones compradas en los 2 meses anteriores al cobro si vendes acciones iguales en los 2 meses siguientes (art. 9.24). No se restan comisiones de cobro ni de custodia (art. 39.1). <b>Doble imposición internacional:</b> se deduce la menor de dos cifras: la retención extranjera de la parte no exenta, o esa parte por tu tipo medio del ahorro (cuota ÷ base, con dos decimales) (arts. 92 y 76.2). Si un dividendo queda exento, la parte exenta se reparte en proporción entre tus dividendos de acciones del año (aproximación de la app). <b>Retención en España:</b> normalmente el 19 % (Circular 1/2026 del Gobierno Vasco); es un pago a cuenta que se descuenta en tu declaración. <b>Resultado estimado</b> = cuota − deducción por doble imposición − retenciones de dividendos. Solo es la parte del ahorro: en tu declaración se suma a la de la base general. Si sale negativo, juega a tu favor.<br><b>Intereses:</b> son rendimiento del capital mobiliario (art. 35) y van con los dividendos. La app usa tus movimientos de la categoría «Intereses»: el importe es lo que te llegó y, si apuntas la retención, calcula el bruto.<br><b>Retenciones en ventas:</b> al reembolsar un fondo con ganancia, la gestora retiene el 19 % de la ganancia (arts. 93 y 94 del Reglamento del IRPF de Álava). No hay retención en traspasos ni en ETFs (art. 78.1). En la venta de derechos de suscripción, el 19 % del importe (art. 95 bis).<br><b>Split y acciones liberadas:</b> no tributan. Las liberadas reparten el coste total entre todas las acciones y toman la antigüedad de las antiguas (art. 47). <b>Venta de derechos:</b> todo el importe es ganancia del año (art. 47.1.a). <b>Prima de emisión y devolución de aportaciones:</b> rebajan el coste de compra; lo que lo supere es rendimiento del capital mobiliario (arts. 34.e y 41.2).</div></details></section>`;
  return h+epsvCard(C);
}
const LIM_EPSV=500000;
function epsvCard(C){const eps=S.inv.ins.filter(x=>x.k==='epsv');if(!eps.length)return'';const ids=new Set(eps.map(x=>x.id)),byY={};for(const o of C.ops)if(o.t==='buy'&&ids.has(o.ins)){const y=o.d.slice(0,4);byY[y]=(byY[y]||0)+o.a}const ys=Object.keys(byY).sort().reverse(),cy=String(new Date().getFullYear()),rs=C.real.filter(r=>r.epsv);
  let h=`<section class="card"><h2>EPSV: aportaciones y rescates</h2>`;
  h+=`<div class="kpis">${kpiS('Aportado en '+cy,eur0(byY[cy]||0),'Límite de reducción: 5.000 €')}${kpiS('Margen este año',eur0(Math.max(0,LIM_EPSV-(byY[cy]||0))),'Para reducir tu base general')}</div>`;
  {const ap=byY[cy]||0,pl=C.pos.filter(p=>p.ins.k==='epsv'&&p.lots.length);let t=`<p style="margin:10px 0 0">${ap?`En ${cy} has aportado ${eur(ap)}: reducen tu base general en ${eur(Math.min(LIM_EPSV,ap))}`:`En ${cy} aún no has aportado`} ${gi('epsv')}. Lo que te ahorras es esa cantidad por tu tipo marginal de la base general; con una beca pequeña puede ser poco o nada.</p>`;
    for(const p of pl){const f=p.lots.reduce((m,l)=>l.d<m?l.d:m,p.lots[0].d),dd=addMonths(f,120),yrs=diffDays(f,today())/365.25;const w70=yrs>2?' (el primer cobro en capital, al 70 %)':' (el 70 % solo si han pasado más de 2 años desde la primera aportación)';t+=`<p style="margin:8px 0 0">Si rescataras hoy <b>${esc(p.ins.n)}</b> en forma de capital (${eur(p.v)}): ${p.g>0.5?`${eur(Math.round(p.c))} son tus aportaciones y tributarían como rendimiento del trabajo en la base general${w70}, y ${eur(Math.round(p.g))} de rentabilidad irían a la base del ahorro, del 19 % al 28 %`:`como vale menos de lo que aportaste (${eur(Math.round(p.c))}), todo contaría como aportaciones y tributaría como rendimiento del trabajo en la base general${w70}; no habría parte de rentabilidad`}. Por antigüedad podrás rescatar desde el ${fdT(dd)}.</p>`}
    h+=t}
  if(ys.length)h+=`<div class="scroll" style="margin-top:10px"><table><thead><tr><th>Año</th><th class="r">Aportado</th><th class="r">Reduce la base</th><th class="r">Exceso</th></tr></thead><tbody>${ys.map(y=>`<tr><td>${y}</td><td class="r">${eur(byY[y])}</td><td class="r">${eur(Math.min(LIM_EPSV,byY[y]))}</td><td class="r">${byY[y]>LIM_EPSV?eur(byY[y]-LIM_EPSV):'—'}</td></tr>`).join('')}</tbody></table></div>`;
  const C2=C.pos.filter(p=>p.ins.k==='epsv'&&p.lots.length);if(C2.length)h+=`<p class="sm" style="margin-top:10px">${C2.map(p=>{const f=p.lots.reduce((m,l)=>l.d<m?l.d:m,p.lots[0].d),dd=addMonths(f,120);return`<b>${esc(p.ins.n)}</b>: aportaciones netas ${eur(p.c)} · rentabilidad acumulada <span style="color:${p.g>=0?'var(--green)':'var(--red)'}">${seur(p.g)}</span> · rescate por antigüedad posible desde ${fdate(dd)} ${dd.slice(0,4)}`}).join('<br>')}</p>`;
  if(rs.length)h+=`<details style="margin-top:8px"><summary>Rescates registrados</summary><div class="list">${rs.slice().reverse().map(r=>{const ap=r.gain>=0?r.cost:r.proceeds,rt=Math.max(0,r.gain);return`<div class="it" style="cursor:default;display:block"><div class="row sp"><b>${esc(insName(r.ins))}</b><span class="nw">${eur(r.proceeds)}</span></div><div class="t2" style="white-space:normal">${fdateL(r.d)} · parte de aportaciones ${eur(ap)} (rendimiento del trabajo, base general) · parte de rentabilidad ${eur(rt)} (base del ahorro)${r.gain<0?' · como el rescate es menor que lo aportado, no hay parte de rentabilidad':''}</div></div>`}).join('')}</div></details>`;
  h+=`<div class="formula" style="margin-top:10px"><b>Aportaciones:</b> reducen tu base imponible general hasta 5.000 € al año en aportaciones propias (límite conjunto de 10.000 € con las de empresa). Lo que exceda, o lo que no quepa por falta de base, se puede reducir en los 5 ejercicios siguientes. Lo que te ahorras es la aportación reducida × tu tipo marginal en la base general: con ingresos bajos puede ser casi nada.<br><b>Prestaciones desde 2026:</b> la parte que corresponde a tus aportaciones tributa como rendimiento del trabajo (base general): en forma de renta al 100 %; en forma de capital, el primer cobro (si han pasado más de 2 años desde la primera aportación) se integra al 70 % hasta 300.000 €. La parte de rentabilidad tributa en la base del ahorro al 100 %, salvo en renta vitalicia o temporal de al menos 15 años y cuantía constante, en la que está exenta (en Álava, hasta el 40 % del importe de la prestación). Las aportaciones anteriores a 2026 cobradas en capital pueden acogerse al régimen anterior. En el año en que cobres en forma de capital, la reducción por las aportaciones de ese año se limita a lo que integres por el cobro.<br><b>Liquidez:</b> se puede rescatar por antigüedad a los 10 años. Cómo se cuentan exactamente, y si ese rescate puede usar la integración al 70 %, depende de tu plan y de la normativa: compruébalo con tu entidad antes de rescatar.<br>Fuente: Gobierno Vasco, esquemas «Régimen de las aportaciones y prestaciones a EPSV» 2025-2026.</div></section>`;
  return h}
