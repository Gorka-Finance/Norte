R_.simfondo=()=>{const I=S.sim.f;return`<div class="stack"><a class="sm" href="#herramientas" style="color:var(--blue);font-weight:700;text-decoration:none">‹ Herramientas</a>
  <section class="card"><div class="row sp"><h2>Tus supuestos</h2><button class="btn" data-act="simmine" data-k="f">Usar mis datos</button></div>
  <div class="fl"><span>Cada cuánto aportas</span><div class="chips">${simChip('f','fr','m','Cada mes')}${simChip('f','fr','y','Cada año')}${simChip('f','fr','x','Cuando quiera')}</div></div>
  ${I.fr==='x'?`<div class="two-in">${simIn('f','c0')}${simIn('f','n')}</div><div class="fl"><span>Tus aportaciones</span></div><p class="sm muted" style="margin-top:2px">Apunta cada una con su mes y su importe. Entra al principio de ese mes.</p>${simExList()}`
   :`<div class="two-in">${simIn('f','c0')}${simIn('f','ap')}</div><div class="two-in">${simIn('f','g')}${simIn('f','n')}</div><details style="margin-top:10px"${(I.ex||[]).length?' open':''}><summary>Aportaciones puntuales, además de la ${I.fr==='m'?'mensual':'anual'}${(I.ex||[]).length?` (${I.ex.length})`:''}</summary><p class="sm muted" style="margin-top:6px">Por ejemplo, un extra cuando cobres algo. Entra al principio del mes que elijas.</p>${simExList()}</details>`}${simIn('f','r')}<p class="sm muted" style="margin-top:4px">Es un supuesto tuyo, no una predicción. La app no lo rellena.</p>
  <div class="two-in">${simIn('f','ter')}${simIn('f','inf')}</div>${simIn('f','vol')}<p class="sm muted" style="margin-top:4px">Cuánto oscila al año. Búscala a 3 o 5 años en la ficha del fondo (Morningstar o el informe de la gestora). 0 = sin rango.</p>
  <label class="check" style="margin-top:6px"><input type="checkbox" data-sim="f" data-k="tx" ${I.tx==='1'?'checked':''}>Restar impuestos si lo vendes todo al final</label>
  <h3 style="margin-top:16px">Calculadora inversa</h3>${simIn('f','goal','p. ej. 30.000')}<div class="chips" style="margin-top:8px">${simChip('f','greal','0','En euros de entonces')}${simChip('f','greal','1','En euros de hoy')}</div></section>
  <div id="simout" class="stack">${simOutF()}</div>${simScen('f')}
  <details><summary>Cómo se calcula</summary><div class="formula" style="margin-top:8px"><b>Cada mes</b>: saldo = (saldo + aportación de ese mes) × (1 + rentabilidad mensual) × (1 − TER mensual), con la rentabilidad y el TER anuales pasados a mensuales. La aportación mensual entra al principio de cada mes; la anual, al principio de cada año (sube un g % cada año); las puntuales, al principio del mes que elijas.<br><b>Rendimiento</b> = valor − lo aportado. Las aportaciones nunca cuentan como rentabilidad: la rentabilidad se aplica al saldo.<br><b>Coste del TER</b> = lo que tendrías sin comisiones − lo que tienes (incluye lo que esas comisiones habrían rentado).<br><b>Impuestos</b>: si vendes todo al final, la ganancia (valor − aportado) tributa en la base del ahorro con la escala de Álava 2026, suponiendo que no tienes otras rentas del ahorro ese año. No aplico coeficientes de actualización futuros (no se conocen), así que el impuesto puede salir algo alto. Mientras no vendas, los traspasos entre fondos no tributan.<br><b>En euros de hoy</b> = valor ÷ (1 + inflación)<sup>años</sup>.<br><b>Rango</b>: 1.000 escenarios con rentabilidades aleatorias (lognormal) de la media y la volatilidad que pones, siempre los mismos para poder comparar. Se muestra entre el escenario del 10 % peor y el del 10 % mejor.<br><b>Calculadora inversa</b>: como el valor final crece en proporción a la aportación, despejo la aportación que llega justo al objetivo con la rentabilidad fija.</div></details></div>`};
R_.simepsv=()=>{const I=S.sim.e;return`<div class="stack"><a class="sm" href="#herramientas" style="color:var(--blue);font-weight:700;text-decoration:none">‹ Herramientas</a>
  <section class="card"><div class="row sp"><h2>Tu EPSV</h2><button class="btn" data-act="simmine" data-k="e">Usar mis datos</button></div>
  <div class="fl"><span>Cada cuánto aportas</span><div class="chips">${simChip('e','fr','m','Cada mes')}${simChip('e','fr','y','Cada año')}${simChip('e','fr','x','Cuando quiera')}</div></div>
  ${I.fr==='x'?`${simIn('e','n')}<div class="fl"><span>Tus aportaciones</span></div><p class="sm muted" style="margin-top:2px">Apunta cada una con su mes y su importe. Entra al principio de ese mes.</p>${simExList('e')}`
   :`<div class="two-in">${simIn('e','ap')}${simIn('e','n')}</div>${simIn('e','g')}<details style="margin-top:10px"${(I.ex||[]).length?' open':''}><summary>Aportaciones puntuales, además de la ${I.fr==='m'?'mensual':'anual'}${(I.ex||[]).length?` (${I.ex.length})`:''}</summary><p class="sm muted" style="margin-top:6px">Por ejemplo, un extra antes de fin de año. Entra al principio del mes que elijas.</p>${simExList('e')}</details>`}
  ${simIn('e','r')}<div class="two-in">${simIn('e','gest')}${simIn('e','dep')}</div>${simIn('e','inf')}
  <details style="margin-top:10px"><summary>Si ya tienes una EPSV</summary><div class="two-in">${simIn('e','c0')}${simIn('e','c0a')}</div></details>
  <h3 style="margin-top:16px">Impuestos</h3>${simIn('e','base','p. ej. 3.000')}<p class="sm muted" style="margin-top:4px">Está en tu última declaración de la renta («base liquidable general»). Si lo dejas vacío, cuento 0 € y no hay ahorro fiscal.</p>
  <div class="fl"><span>Cómo lo rescatas al final</span><div class="chips">${simChip('e','res','cap','Todo de golpe (capital)')}${simChip('e','res','renta','Poco a poco (renta)')}</div></div>
  ${I.res==='renta'?simIn('e','ra','p. ej. 6.000'):''}${simIn('e','baseR','p. ej. 20.000')}<p class="sm muted" style="margin-top:4px">Tus otros ingresos ese año (sueldo o pensión). Si lo dejas vacío, cuento 0 €.</p>
  <h3 style="margin-top:16px">Fondo indexado para comparar</h3><div class="two-in">${simIn('e','rF')}${simIn('e','terF')}</div></section>
  <div id="simout" class="stack">${simOutE()}</div>${simScen('e')}
  <details><summary>Cómo se calcula</summary><div class="formula" style="margin-top:8px"><b>Basado en tu Excel</b>: cada año, saldo = (saldo + aportación) × (1 + rentabilidad) × (1 − comisión de gestión − comisión de depósito). Corrijo dos fallos: la comisión de gestión del año 1 miraba la celda de la de depósito (si la dejabas vacía, la de gestión salía 0), y el año 1 cobraba las comisiones sobre la aportación sin revalorizar mientras los demás años lo hacían sobre el saldo revalorizado. Ahora todos los años se calculan igual. Con aportación mensual, lo mismo pero cada mes. Con aportaciones puntuales o «Cuando quiera», el cálculo se hace siempre mes a mes y cada aportación entra al principio de su mes.<br><b>Ahorro fiscal</b> (Álava 2026): la aportación reduce tu base general hasta 5.000 € al año. Ahorro = cuota con tu base − cuota con la base reducida, con la escala general 2026 y la minoración de 1.615 €. Si tu cuota ya es 0, no ahorras nada. Supongo la misma base todos los años y no cuento otras deducciones. Con aportaciones puntuales, el ahorro se calcula por año natural (enero a diciembre), con el límite de 5.000 € en cada uno.<br><b>Rescate en capital</b> (primer cobro, más de 2 años desde la primera aportación): la parte de aportaciones se integra al 70 % (hasta 300.000 €) en la base general como rendimiento del trabajo; la rentabilidad, al 100 % en la base del ahorro. Lo aportado antes de 2026 se integra al 60 %; aquí aplico el 70 % a todo.<br><b>Rescate en renta</b>: la parte de aportaciones, al 100 % en la base general cada año; la rentabilidad, en la base del ahorro, exenta hasta el 40 % de cada cobro si la renta dura al menos 15 años con importe constante. Cómo reparte cada cobro entre aportaciones y rentabilidad lo informa tu EPSV; aquí lo reparto en proporción (estimación).<br><b>Fondo con el mismo esfuerzo</b>: aporta lo mismo que la EPSV menos el ahorro fiscal de cada año, para que de tu bolsillo salga lo mismo. Al final se vende todo y la ganancia tributa en la base del ahorro.<br><b>Liquidez</b>: en una EPSV individual, el rescate sin contingencia suele exigir 10 años de antigüedad (lo fija el reglamento de cada plan); un fondo se puede vender o traspasar cuando quieras.</div></details></div>`};

function simMsgBox(k){return simMsg&&simMsg.k===k?`<div class="alert info"><span class="ic">i</span><span>${simMsg.t}</span></div>`:''}

  const goal=P.goal;if(goal>0){const real=S.sim.f.greal==='1',tgt=real?goal*df:goal,need=invNeed(P,tgt),yr=P.ap>0||exN?yearsTo(P,goal,real):null;

/* Intereses previstos hasta el 31/12 del año en curso (estimación): tantos cobros como en los últimos 90 días, cada uno del importe típico (la mediana, para que un cobro suelto grande, como un depósito que vence, no dispare la previsión). Solo si hay al menos 2 cobros en ese tiempo. */
function intProj(y){const td=today();if(+td.slice(0,4)!==y)return null;const from=addDays(td,-90),a=[];for(const t of allTx())if(t.t==='i'&&isIntCat(t.c)&&t.d>from&&t.d<=td)a.push(t.a+(t.wr||0));if(a.length<2)return null;a.sort((p,q)=>p-q);const k=a.length>>1,med=a.length%2?a[k]:(a[k-1]+a[k])/2,left=diffDays(td,y+'-12-31');return left>0?Math.round(med*a.length/90*left):0}
/* Margen fiscal del año con la previsión de intereses: cuánto queda para el límite de 1.600 € (art. 102.2.b). */
function taxMargin(y){const X=taxCalc(y),pj=intProj(y);return{X,pj,mEnd:pj==null?X.mCap:X.mCap-pj}}
/* Aviso al vender: si la venta te obliga a declarar y quita la deducción a tus padres. g = ganancia que tributa (céntimos), gr = retención. */
function threshText(y,g,gr){if(!(y>=TAX_Y0))return'';const A=taxCalc(y);if(A.obl)return'';const B=taxCalc(y,{g,gr}),fam=A.T.dsc!=='no'&&A.parentsOK;
  if(B.obl)return` <b>Ojo:</b> con esta venta tus rendimientos del capital y ganancias de ${y} llegarían a ${eur(B.cap)} y pasarías de 1.600 €: <b>tendrías que presentar la declaración</b>${fam?` y tus padres perderían la deducción por ti (${eur(A.dLoss)})`:''}. Para no pasar del límite, este año la ganancia tendría que quedarse en unos ${eur(Math.max(0,A.mCap))}${intProj(y)?' (menos los intereses que cobres hasta diciembre)':''}.`;
  return` Seguirías sin tener que declarar en ${y}: te quedarían ${eur(B.mCap)} de margen hasta los 1.600 €.`}
function taxYears(){const cy=+today().slice(0,4),ys=new Set([Math.max(TAX_Y0,cy)]);if(+today().slice(5,7)<=6&&cy-1>=TAX_Y0)ys.add(cy-1);for(const k of Object.keys(S.cfg.tax||{}))if(+k>=TAX_Y0)ys.add(+k);if(S.inv.ins.length)for(const r of fiscalYears(computeInv()).years)if(r.y>=TAX_Y0)ys.add(r.y);return[...ys].sort((a,b)=>b-a)}

function twiCard(y){const I=S.twi,C=S.inv.ins.length?computeInv():null,ps=C?C.pos.filter(p=>p.u>1e-9&&p.ins.k!=='epsv'):[];

  <label class="check" style="margin-top:6px"><input type="checkbox" data-twi="gf" ${I.gf?'checked':''}>Es un fondo: me retienen el 19 %</label><p class="sm muted" style="margin-top:2px">Al vender acciones o ETFs no hay retención.</p>

function twiOut(y){const adj=twiAdj();if(!adj.g&&!adj.ci&&!adj.ep&&!adj.w)return`<p class="sm muted">Escribe algún cambio para ver cómo quedaría.</p>`;
  const A=taxCalc(y),B=taxCalc(y,adj),E=c=>eur(c),paid=X=>X.files?X.cl:X.ret,dPaid=paid(B)-paid(A),dFam=B.famLoss-A.famLoss,dTot=dPaid+dFam,yn=v=>v?'Sí':'No',showP=A.T.dsc!=='no';
  const rows=[['Impuesto total del año',E(paid(A)),E(paid(B))],['Cuota líquida',E(A.cl),E(B.cl)],['Ya retenido',E(A.ret),E(B.ret)],['¿Obligado a declarar?',yn(A.obl),yn(B.obl)],...(showP?[['¿Tus padres pueden deducir por ti?',yn(A.parentsOK),yn(B.parentsOK)]]:[]),['Capital y ganancias (límite 1.600 €)',E(A.cap),E(B.cap)]];
  let msg;if(Math.abs(dTot)<1)msg='Con estos cambios no cambia lo que pagáis.';else msg=`${dPaid>=1?`Pagarías <b>${E(dPaid)} más</b> de impuestos`:dPaid<=-1?`Pagarías <b>${E(-dPaid)} menos</b> de impuestos`:'Tus impuestos no cambian'}${dFam>0?` y tus padres perderían <b>${E(dFam)}</b> de deducción`:dFam<0?` y tus padres recuperarían ${E(-dFam)} de deducción`:''}${dFam?`: en total, <b>${dTot>0?E(dTot)+' más':E(-dTot)+' menos'}</b> para la familia`:''}.`;
  const why=[];if(B.obl&&!A.obl)why.push(B.oblC?`pasarías de 1.600 € de capital y ganancias (${E(B.cap)})`:B.oblW?`pasarías de 20.000 € del trabajo`:'');if(adj.ep&&B.red===A.red)why.push('la aportación a EPSV no te ahorra nada porque tu base general ya es 0 €');else if(adj.ep&&B.red>A.red&&B.cg===A.cg)why.push('la aportación a EPSV reduce tu base, pero tu cuota general ya era 0 €');
  return`<div class="scroll"><table class="ctab"><thead><tr><th></th><th class="r">Ahora</th><th class="r">Con los cambios</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="r nw">${r[1]}</td><td class="r nw">${r[2]}</td></tr>`).join('')}</tbody></table></div>
  <p style="margin-top:8px">${msg}${why.filter(Boolean).length?' Ojo: '+why.filter(Boolean).join('; ')+'.':''}</p>
  <p class="sm muted" style="margin-top:6px">«Impuesto total» es lo que acabas pagando por el año: si declaras, la cuota líquida; si no estás obligado ni declaras, lo que ya te han retenido.</p>`}
let twiT=null;function twiInput(t){S.twi[t.dataset.twi]=t.type==='checkbox'?t.checked:t.value;clearTimeout(twiT);twiT=setTimeout(()=>{const o=$('#twiout');if(o)o.innerHTML=twiOut(S.ty)},t.type==='checkbox'?0:250)}
/* ---------- Planificación de fin de año (fase 4, bloque 5) ----------
   Cuánto se puede vender de cada posición sin pasar del margen de 1.600 € (art. 102.2.b), con FIFO y coeficientes de actualización (art. 45.2):
   la ganancia de una venta es la suma, lote a lote, de (precio de hoy − coste actualizado por participación). Se busca el máximo de participaciones cuya ganancia no pasa del margen. */
function sellCap(p,M){const td=today(),px=p.px&&p.px.v>0?p.px.v:null;if(!px)return null;const L=(runFifo(opsSorted().filter(o=>o.d<=td)).lots[p.ins.id]||[]).filter(l=>l.u>1e-9);if(!L.length)return null;
  let cum=0,u=0,best=0,bestG=0;for(const l of L){const cpu=adjCost([{d:l.d,u:l.u,c:l.c}],td).c/l.u/100,g=px-cpu,end=cum+g*l.u;
    if(g>0){if(end<=M){u+=l.u;cum=end;best=u;bestG=cum}else{const part=Math.max(0,(M-cum)/g);if(cum+g*part<=M+1e-9&&u+part>best){best=u+part;bestG=cum+g*part}u+=l.u;cum=end}}
    else{u+=l.u;cum=end;if(cum<=M){best=u;bestG=cum}}}
  const all=Math.abs(best-L.reduce((s,l)=>s+l.u,0))<1e-6;return{u:best,v:Math.round(best*px*100),g:Math.round(bestG*100),all,px}}
function planCard(y){const td=today(),cy=+td.slice(0,4);if(y!==cy)return'';const M=taxMargin(y),X=M.X,C=S.inv.ins.length?computeInv():null,ps=C?C.pos.filter(p=>p.u>1e-9&&p.ins.k!=='epsv'):[];
  const left=diffDays(td,y+'-12-31'),m=M.mEnd,items=[];
  if(X.obl)items.push(`<li>Este año ya tienes que declarar${X.oblC?` (capital y ganancias: ${eur(X.cap)})`:''}: el límite de 1.600 € ya no te condiciona. Lo que cuenta ahora es la cuota: ${X.res>0?`te saldría a pagar unos ${eur(X.res)}`:X.res<0?`te devolverían unos ${eur(-X.res)}`:'te saldría 0 €'}.</li>`);
  else items.push(`<li>Te quedan <b>${eur(Math.max(0,m))}</b> de margen hasta los 1.600 € de capital y ganancias${M.pj?` (ya cuento unos ${eur(M.pj)} de intereses hasta el 31 de diciembre)`:''}. Si lo pasas, tendrás que declarar${X.T.dsc!=='no'?` y tus padres perderán ${eur(X.dLoss)} de deducción por ti`:''}.</li>`);
  let tbl='';if(ps.length){const rows=ps.map(p=>{const c=sellCap(p,Math.max(0,X.obl?Infinity:m)/100);if(!c)return`<div class="it" style="cursor:default"><span class="tx"><span class="t1">${esc(p.ins.n)}</span><span class="t2" style="white-space:normal">Plusvalía hoy ${seur(p.g)} · falta el VL de hoy para calcularlo</span></span></div>`;const ret=p.ins.k==='fondo'&&c.g>0?Math.round(c.g*0.19):0;return`<div class="it" style="cursor:default"><span class="tx"><span class="t1">${esc(p.ins.n)}</span><span class="t2" style="white-space:normal">Plusvalía hoy ${seur(p.g)}${c.all?'':` · ${fmtN(c.u,4)} part.`} · retención ${ret?eur(ret):'0 €'}</span></span><span class="am" style="text-align:right">${c.all?`Todo<span class="sm muted" style="display:block;font-weight:400">${eur(c.v)}</span>`:eur(c.v)}</span></div>`}).join('');
    if(!X.obl)tbl=`<h3 style="margin-top:14px">Cuánto puedes vender sin tener que declarar</h3><div class="row sp sm muted" style="margin-top:6px"><span>Posición</span><span>Puedes vender</span></div><div class="list">${rows}</div><p class="sm muted" style="margin-top:6px">Con FIFO (vendes primero lo más antiguo) y los coeficientes de actualización, al VL de hoy y sin comisiones. Cada fila es por separado: si vendes de dos, el margen se reparte. En fondos, la gestora retiene el 19 % de la ganancia; si no declaras, esa retención es tu impuesto definitivo.</p>`}
  if(ps.some(p=>p.ins.k==='fondo'))items.push(`<li>Si lo que quieres es cambiar de fondo o rebalancear, haz un <b>traspaso</b>: no tributa ni cuenta para el límite (art. 48). En ETFs y acciones no hay traspasos.</li>`);
  const lossP=ps.filter(p=>p.g<-100);if(lossP.length&&X.obl&&X.FY&&X.FY.g>0)items.push(`<li>Tienes pérdidas latentes en ${lossP.map(p=>`${esc(p.ins.n)} (${seur(p.g)})`).join(', ')}. Venderlas antes del 31/12 restaría de tus ganancias del año; pero si recompras lo mismo en ${washMonths(lossP[0].ins.id)===12?'1 año':'2 meses'} (antes o después), la pérdida se aplaza (art. 43).</li>`);
  const e1=taxCalc(y,{ep:100000}),sv=X.cl-e1.cl;items.push(sv>=1?`<li>Aportar 1.000 € a una EPSV este año te ahorraría unos <b>${eur(sv)}</b> de IRPF${X.files?'':' (solo si declaras)'}.</li>`:`<li>Aportar a una EPSV este año <b>no te ahorraría nada</b>: tu cuota general ya es 0 €${X.blg>0?'':' (tu base general es 0 €)'}. Solo compensa cuando tengas sueldo.</li>`);
  return`<section class="card"><h2>Antes del 31 de diciembre</h2><p class="sm muted" style="margin-top:4px">Quedan ${plu(left,'día','días')} para cerrar ${y}. Las ventas y aportaciones cuentan en el año en que se hacen.</p><ul class="sm" style="margin-top:8px;padding-left:18px;line-height:1.5">${items.join('')}</ul>${tbl}</section>`}
/* ---------- Datos para la declaración (fase 4, bloque 6) ----------
   Las cifras que piden la declaración o el borrador de Hacienda Foral, sacadas de los mismos cálculos: trabajo por pagador, capital mobiliario, cada venta con sus valores, EPSV y retenciones. */
function declData(y){const X=taxCalc(y),FY=X.FY,sec=[];
  const tw=X.inc.map(w=>({n:w.n||'Ingreso del trabajo',b:w.brut,ss:w.ss,wr:w.wr,ex:!!w.ex}));if(tw.length)sec.push({t:'Rendimientos del trabajo',rows:tw.map(w=>[w.n+(w.ex?' (exento, no se declara)':''),`Bruto ${eur(w.b)} · Seguridad Social ${eur(w.ss)} · retención ${eur(w.wr)}`])});
  const rc=[];if(FY&&FY.rc&&FY.rc.nInt)rc.push(['Intereses de cuentas',`Bruto ${eur(FY.rc.int)} · retención ${eur(FY.rc.wrI)}`]);if(FY&&FY.dv)rc.push(['Dividendos',`Bruto ${eur(FY.dv.g)} · exento ${eur(FY.dv.ex||0)} · retención ${eur(FY.dv.wr)}${FY.dv.wo?` · retención en origen ${eur(FY.dv.wo)}`:''}`]);if(FY&&FY.rc&&FY.rc.pex)rc.push(['Prima de emisión o devolución de aportaciones (exceso)',`${eur(FY.rc.pex)} · retención ${eur(FY.rc.wrP)}`]);if(rc.length)sec.push({t:'Rendimientos del capital mobiliario',rows:rc});
  const sl=[];if(FY)for(const r of FY.rows){if(r.ins==='__sim')continue;const x=insById(r.ins),ds=(r.pieces||[]).map(q=>q.d).sort(),fc=ds.length?(ds[0]===ds[ds.length-1]?fdT(ds[0]):fdT(ds[0])+' – '+fdT(ds[ds.length-1])):'';
    sl.push([`${fdT(r.d)} · ${x?esc(x.n):'?'}${x&&x.isin?' ('+x.isin+')':''}`,`Compra ${fc} · valor de transmisión ${eur(r.proceeds)} · valor de adquisición actualizado ${eur(Math.round(r.costAdj))} · ${r.gainAdj>=0?'ganancia':'pérdida'} ${eur(Math.abs(Math.round(r.gainAdj)))}${r.def<-0.5?` (aplazada por recompra ${eur(Math.round(-r.def))})`:''}${r.op&&r.op.wr?` · retención ${eur(r.op.wr)}`:''}`])}
  if(FY&&FY.der)for(const o of FY.der){const x=insById(o.ins);sl.push([`${fdT(o.d)} · Venta de derechos ${x?esc(x.n):''}`,`Ganancia ${eur(o.a)}${o.wr?` · retención ${eur(o.wr)}`:''}`])}
  if(sl.length)sec.push({t:'Ganancias y pérdidas por ventas',rows:sl});
  if(FY&&FY.used)sec.push({t:'Compensación',rows:[['Pérdidas de años anteriores que se restan este año',eur(Math.round(FY.used))]]});
  if(X.ep)sec.push({t:'Reducciones de la base general',rows:[['Aportaciones a EPSV',`${eur(X.ep)} · reducción ${eur(X.red)}`]]});
  sec.push({t:'Retenciones y pagos a cuenta',rows:[['Del trabajo',eur(X.retW)],['Del ahorro (intereses, dividendos, ventas de fondos, derechos)',eur(X.retA)]]});
  return{X,sec}}
function declCard(y){const D=declData(y),X=D.X;return`<details class="card"${X.obl?' open':''}><summary><b>Datos para tu declaración de ${y}</b></summary><p class="sm muted" style="margin-top:6px">Para revisar el borrador o la propuesta de Hacienda Foral o rellenar la declaración. Comprueba cada cifra con los certificados de tu banco, tu plataforma y tu pagador.</p>
  ${D.sec.map(sx=>`<h3 style="margin-top:12px">${sx.t}</h3><div class="scroll"><table class="ctab" style="margin-top:4px"><tbody>${sx.rows.map(r=>`<tr><td>${r[0]}</td><td class="sm">${r[1]}</td></tr>`).join('')}</tbody></table></div>`).join('')}
  <div class="row" style="margin-top:12px"><button class="btn" data-act="declcopy">Copiar como texto</button></div></details>`}
function declText(y){const D=declData(y),strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");return`Datos para la declaración de ${y} (estimación de Norte)\n`+D.sec.map(sx=>`\n${sx.t}\n`+sx.rows.map(r=>`- ${strip(r[0])}: ${strip(r[1])}`).join('\n')).join('\n')+`\n\nResultado estimado: ${D.X.res>0?'a pagar '+strip(eur(D.X.res)):D.X.res<0?'a devolver '+strip(eur(-D.X.res)):'0 €'}. ¿Obligado a declarar? ${D.X.obl?'Sí':'No'}.`}

function taxIncRow(w,i){return`<div class="card" style="background:var(--panel);margin-top:10px;padding:12px"><div class="row sp"><input data-taxw="${i}" data-f="n" value="${esc(w.n||'')}" placeholder="Nombre (p. ej. Beca de prácticas)" aria-label="Nombre del ingreso" style="flex:1"><button type="button" class="btn" data-act="taxdel" data-i="${i}" aria-label="Quitar este ingreso">✕</button></div>

function taxHow(){return`<b>Trabajo</b>: ingresos brutos − Seguridad Social (art. 22.a) − bonificación (art. 23): 8.000 € si la diferencia no pasa de 14.800 €; entre 14.800 y 23.000 €, 8.000 € − 0,6098 × (diferencia − 14.800 €); por encima, 3.000 €; y 3.000 € si tienes más de 7.500 € de rentas que no son del trabajo (cuento tu base del ahorro). La bonificación no deja el rendimiento en negativo.<br><b>Base liquidable general</b> = rendimiento neto del trabajo − aportaciones a EPSV del año (hasta 5.000 €). Solo cuento el trabajo: si tienes otros ingresos de la base general (alquileres, actividades), dímelo.<br><b>Cuota general</b> = escala general 2026 (23 % hasta 18.080 € … 49 % desde 208.390 €) − minoración de 1.615 €, sin bajar de 0 (arts. 74, 75 y 77). La minoración no reduce la cuota del ahorro.<br><b>Cuota del ahorro</b>, doble imposición y retenciones del ahorro: las de Inversiones › Fiscalidad.<br><b>Resultado</b> = cuota líquida (sin bajar de 0, art. 78) − retenciones.<br><b>Obligación de declarar</b> (art. 102.2): no estás obligado si solo tienes rendimientos del trabajo de hasta 20.000 € brutos y rendimientos del capital más ganancias (incluidos los exentos) de hasta 1.600 €. Los ingresos exentos del trabajo no cuentan. Cuento como capital y ganancias: intereses y dividendos brutos, primas y la ganancia de las ventas del año. Un rescate de EPSV lo marco como obligación porque no lo calculo.<br><b>Tus padres</b> (art. 79.3): no pueden aplicar la deducción por ti si tienes más de 30 años, si tus rentas no exentas pasan del salario mínimo del año (17.094 € en 2026) o si presentas o estás obligado a presentar declaración. La deducción es de 734,80 € por el primer hijo, 909,70 € por el segundo, 1.532,30 € por el tercero, 1.811,70 € por el cuarto y 2.366,10 € del quinto en adelante.`}
function taxLaw(){return`Norma Foral 33/2013 del IRPF de Álava, texto consolidado publicado por la Diputación Foral: ${srcLink('https://web.araba.eus/documents/d/araba/indice_norma-foral_irpf_cas-7-pdf')}. Artículos 9.9 (becas exentas), 18.g (becas como trabajo), 22.a (Seguridad Social), 23 (bonificación), 74, 75, 77 y 78 (cuota), 79 (descendientes) y 102 (obligación de declarar). Escala general 2026: NF 21/2025 (BOTHA nº 147, 29/12/2025). Salario mínimo: Real Decreto 126/2026 (1.221 € × 14 = 17.094 €) ${srcLink('https://www.boe.es/eli/es/rd/2026/02/18/126/con')} y Real Decreto 87/2025 (1.184 € × 14 = 16.576 €).<br>Es una estimación para ti, no tu declaración: no incluye todas las deducciones ni situaciones (alquileres, actividades, tributación conjunta, discapacidad…). Compruébala con el borrador de Hacienda Foral cuando salga.`}

   Fuera de claude.ai, cada documento (config, inv, fichas, m-AAAA-MM) se guarda primero en el dispositivo (IndexedDB) y luego
   se sube a Firestore por su API REST. Cada documento recuerda la versión del servidor en la que se basa (updateTime): al subir
   se exige que el servidor siga en esa versión; si otro dispositivo lo cambió, se lee, se combina a tres bandas con merge3 (igual
   que entre dispositivos en claude.ai) y se reintenta. Un índice (meta/idx) guarda la revisión de cada documento, así que para
   saber qué ha cambiado en otro dispositivo basta con leer un documento. Sin conexión se apunta igual: se sube al volver. */

      for(const[id,r]of this.recs)if(r.p!=null)this.kick(id)}
    catch(e){this.fail(e)}finally{this.syncing=null;this.paint()}})();return this.syncing},
  kick(id){if(!NCLOUD||!AUTH.u||this.state==='denied'||this.state==='auth')return;if(this.busy.has(id)){this.again.add(id);return}this.push(id)},
  async push(id){this.busy.add(id);this.paint();
    try{for(let att=0;att<8;att++){const r=this.recs.get(id);if(!r||r.p==null)break;const P=r.p,pv=r.pv,rev=nrev();
        try{const ut=await fsCommit(id,P,r.ut,rev),cur=this.recs.get(id),nr=Object.assign({},cur,{c:P,ut,rev});if(cur.pv===pv)nr.p=null;await this.put(id,nr);this.state='ok';this.lastSync=Date.now();this.tell(id);continue}
        catch(e){if(e.code!=='conflict'&&e.code!=='not_found')throw e}
        /* otro dispositivo lo cambió: se combina a tres bandas y se vuelve a intentar sobre su versión */
        const s=await fsGet(id),cur=this.recs.get(id);let M=cur.p;
        if(s&&s.data!=null)M=fixDoc(id,merge3(jclone(cur.c)||{},jclone(cur.p),jclone(s.data)));
        await this.put(id,Object.assign({},cur,{c:s?s.data:null,ut:s?s.ut:null,rev:s?s.rev:'',p:M}));this.emit([['modified',id,jclone(M)]],false);this.tell(id)}}
    catch(e){this.fail(e)}finally{this.busy.delete(id);if(this.again.delete(id))this.kick(id);this.paint()}},
  fail(e){const c=e&&e.code;console.warn('norte',c,e);
    if(c==='offline'||c==='unavailable'){this.state='offline'}
    else if(c==='denied'){this.state='denied';gateShow('denied')}
    else if(c==='unauthenticated'){this.state='auth';gateShow('auth')}
    else if(c==='quota')this.state='quota';else this.state='error';
    if(c!=='denied'&&c!=='unauthenticated'){clearTimeout(this.retry);this.retry=setTimeout(()=>this.sync(),c==='quota'?600000:30000)}},
  tell(id){try{this.bc&&this.bc.postMessage({uid:this.uid,id})}catch(e){}},
  async heard(m){if(!m||m.uid!==this.uid)return;try{const r=await IDB.get(this.key(m.id));if(!r)return;this.recs.set(m.id,r);const d=this.view(r);if(d!=null)this.emit([['modified',m.id,jclone(d)]],false)}catch(e){}},
  status(){const n=this.pending();
    if(this.volatile)return['err','No se puede guardar en este dispositivo'];
    if(!NCLOUD)return['ok','Guardado en este dispositivo'];
    if(this.state==='denied')return['err','Sin acceso a la nube'];if(this.state==='auth')return['err','Inicia sesión para sincronizar'];
    if(n)return this.state==='offline'||!navigator.onLine?['busy','Sin conexión: guardado en este dispositivo']:this.state==='quota'?['err','Límite diario de la nube: guardado en este dispositivo']:['busy','Sincronizando…'];
    if(this.state==='offline'||!navigator.onLine)return['busy','Sin conexión'];return['ok','Guardado']},
  paint(){if(typeof pend!=='undefined'&&[...pend.values()].some(x=>x.busy))return;setSync(...this.status());if(view()==='ajustes'&&!sheetKind&&!D.activeElement?.matches?.('input,select,textarea'))render()}};
const okSync=()=>NORTE?NB.status():['ok','Guardado'];

/* --- pantalla de acceso --- */
let GATE=null;
function gateShow(kind,msg){let g=$('#gate');if(!g){g=D.createElement('div');g.id='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');D.body.appendChild(g)}
  const u=AUTH.u,em=esc((u&&u.email)||(GATE&&GATE.email)||''),logo=`<svg class="glogo" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a74ff"/><stop offset="1" stop-color="#0636a8"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#gg)"/><path d="M256 84 L284 244 L420 272 L284 300 L256 432 L228 300 L92 272 L228 244 Z" fill="#fff"/><path d="M256 84 L284 244 L256 272 L228 244 Z" fill="#ffd166"/><circle cx="372" cy="150" r="16" fill="#ffd166"/></svg>`;
  let h=`<div class="gcard">${logo}<h1>Norte</h1><p class="gtag">Tu dinero, con rumbo</p>`;
  if(kind==='in'||kind==='auth'||kind==='up'){const up=kind==='up';
    h+=`${kind==='auth'?'<p class="sm">Tu sesión ha caducado. Vuelve a entrar para seguir sincronizando (lo que has apuntado sigue en este dispositivo).</p>':''}
    <form id="gform" novalidate><label class="fl"><span>Correo</span><input id="g-em" type="email" autocomplete="username" inputmode="email" value="${em}" required></label>
    <label class="fl"><span>Contraseña${up?' (mínimo 8 caracteres)':''}</span><input id="g-pw" type="password" autocomplete="${up?'new-password':'current-password'}" required></label>
    ${up?'<label class="fl"><span>Repite la contraseña</span><input id="g-pw2" type="password" autocomplete="new-password" required></label>':''}
    <div class="err" id="g-err" role="alert">${esc(msg||'')}</div>
    <button class="pri" type="submit" style="width:100%;margin-top:12px">${up?'Crear cuenta':'Entrar'}</button></form>
    <div class="gacts">${up?'<button class="lnk" data-g="in">Ya tengo cuenta</button>':'<button class="lnk" data-g="up">Crear cuenta</button><button class="lnk" data-g="reset">He olvidado la contraseña</button>'}</div>`}
  else if(kind==='verify')h+=`<p>Te he enviado un correo a <b>${em}</b>. Ábrelo, pulsa el enlace para confirmar tu dirección y vuelve aquí.</p><div class="err" id="g-err" role="alert">${esc(msg||'')}</div>
    <button class="pri" data-g="checkver" style="width:100%;margin-top:12px">Ya lo he confirmado</button><div class="gacts"><button class="lnk" data-g="resend">Reenviar el correo</button><button class="lnk" data-g="other">Usar otra cuenta</button></div>`;
  else if(kind==='denied')h+=`<p>Tu cuenta <b>${em}</b> todavía no tiene acceso a esta app.</p><p class="sm muted">Si la app es tuya, añade este correo a la lista de invitados (reglas de Firestore). Si te la ha pasado alguien, pídele que te añada.</p><div class="err" id="g-err" role="alert">${esc(msg||'')}</div>
    <button class="pri" data-g="retry" style="width:100%;margin-top:12px">Reintentar</button><div class="gacts"><button class="lnk" data-g="other">Usar otra cuenta</button></div>`;
  h+=`<p class="sm muted gfoot">Tus datos se guardan en este dispositivo y en tu base de datos privada. Nadie más puede leerlos.</p></div>`;
  g.innerHTML=h;g.dataset.kind=kind;g.hidden=false;D.body.classList.add('gated');
  const f=$('#gform');if(f)f.addEventListener('submit',e=>{e.preventDefault();gateSubmit(kind==='up')});
  for(const b of $$('[data-g]',g))b.addEventListener('click',e=>{e.preventDefault();gateAct(b.dataset.g,b)});
  setTimeout(()=>{if(g.contains(D.activeElement))return;const i=$('#g-em',g);if(i&&!i.value)i.focus();else{const p=$('#g-pw',g);if(p)p.focus()}},50)}
function gateHide(){const g=$('#gate');if(g){g.hidden=true;g.innerHTML=''}D.body.classList.remove('gated')}
const gateErr=t=>{const e=$('#g-err');if(e)e.textContent=t};
function authMsg(e){const m=String((e&&e.msg)||'');if(e&&e.code==='offline')return'No hay conexión. Prueba otra vez cuando tengas internet.';
  if(/EMAIL_EXISTS/.test(m))return'Ya hay una cuenta con ese correo: pulsa «Ya tengo cuenta».';if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m))return'Correo o contraseña incorrectos.';
  if(/WEAK_PASSWORD/.test(m))return'La contraseña es demasiado corta.';if(/INVALID_EMAIL/.test(m))return'Ese correo no es válido.';if(/TOO_MANY_ATTEMPTS/.test(m))return'Demasiados intentos. Espera unos minutos.';
  if(/USER_DISABLED/.test(m))return'Esta cuenta está desactivada.';if(/OPERATION_NOT_ALLOWED|PASSWORD_LOGIN_DISABLED/.test(m))return'El acceso con correo y contraseña no está activado en Firebase (Authentication › Método de acceso).';
  return'No ha funcionado ('+(m||(e&&e.code)||'error')+'). Inténtalo otra vez.'}
async function gateSubmit(up){const em=($('#g-em').value||'').trim(),pw=$('#g-pw').value||'';GATE.email=em;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return gateErr('Escribe un correo válido.');
  if(up){if(pw.length<8)return gateErr('La contraseña tiene que tener al menos 8 caracteres.');if(pw!==$('#g-pw2').value)return gateErr('Las dos contraseñas no coinciden.')}
  const btn=$('#gform button[type=submit]');btn.disabled=true;btn.textContent=up?'Creando…':'Entrando…';
  try{const prev=GATE.uid;if(up)await AUTH.signUp(em,pw);else await AUTH.signIn(em,pw);
    if(prev&&prev!==AUTH.u.uid){location.reload();return}
    if(!AUTH.u.ver){let v=false;try{v=await AUTH.verified()}catch(e){}if(!v){gateShow('verify',up?'':'Antes de entrar tienes que confirmar tu correo. Si no encuentras el correo, mira en spam o pulsa «Reenviar».');return}}
    gateDone()}
  catch(e){btn.disabled=false;btn.textContent=up?'Crear cuenta':'Entrar';gateErr(authMsg(e))}}
async function gateAct(a,b){
  if(a==='up'||a==='in')return gateShow(a);
  if(a==='reset'){const em=($('#g-em').value||'').trim();if(!em)return gateErr('Escribe tu correo y vuelve a pulsar «He olvidado la contraseña».');
    try{await AUTH.reset(em);gateErr('Te he enviado un correo para cambiar la contraseña (mira también en spam).')}catch(e){gateErr(authMsg(e))}return}
  if(a==='resend'){try{await AUTH.sendVerify();gateErr('Correo reenviado. Mira también en spam.')}catch(e){gateErr(authMsg(e))}return}
  if(a==='checkver'){b.disabled=true;try{if(await AUTH.verified())return gateDone();gateErr('Todavía no consta confirmado. Pulsa el enlace del correo y vuelve a probar.')}catch(e){gateErr(authMsg(e))}b.disabled=false;return}
  if(a==='other'){const had=AUTH.u&&NB.uid;await AUTH.out();if(had){location.reload();return}return gateShow('in')}
  if(a==='retry'){b.disabled=true;NB.state='ok';gateHide();await NB.sync();if(NB.state==='denied')return;for(const[id,r]of NB.recs)if(r.p!=null)NB.kick(id)}}
function gateDone(){gateHide();if(GATE&&GATE.done){const f=GATE.done;GATE.done=null;f(AUTH.u.uid)}else{NB.state='ok';NB.sync();for(const[id,r]of NB.recs)if(r.p!=null)NB.kick(id)}}
async function nbAuth(){NORTE=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
  if(!NCLOUD){NB.uid='local';return'local'}
  await AUTH.load();GATE={email:AUTH.u?AUTH.u.email:'',uid:null,done:null};
  if(AUTH.u&&AUTH.u.ver){NB.uid=AUTH.u.uid;return AUTH.u.uid}
  const uid=await new Promise(res=>{GATE.done=res;gateShow(AUTH.u?'verify':'in')});GATE.uid=uid;NB.uid=uid;return uid}
async function nbSignOut(){const n=NB.pending();await AUTH.out();try{for(const[k]of await IDB.all('d:'+NB.uid+':'))await IDB.del(k)}catch(e){}location.reload();return n}

/* --- descargas fuera de claude.ai: en iPhone, hoja de compartir (Guardar en Archivos); en el resto, descarga normal --- */
const localDL={async save({filename,data}){const type=/\.json$/i.test(filename)?'application/json':/\.xlsx$/i.test(filename)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/octet-stream',blob=new Blob([data],{type});
  if(isIOS()&&navigator.canShare){try{const f=new File([blob],filename,{type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return{status:'saved'}}}catch(e){if(e&&e.name==='AbortError')throw{code:'declined'}}}
  const u=URL.createObjectURL(blob),a=D.createElement('a');a.href=u;a.download=filename;a.rel='noopener';a.style.display='none';D.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},5000);return{status:'saved'}}};

/* --- instalar --- */
let BIP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();BIP=e;if(view()==='ajustes')render()});
addEventListener('appinstalled',()=>{BIP=null;if(view()==='ajustes')render()});
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function norteCards(){if(!NORTE)return'';const st=NB.status(),u=AUTH.u,n=NB.pending();
  let h=`<section class="card"><h2>Cuenta y sincronización</h2>`;
  if(!NCLOUD)h+=`<p class="sm">Modo «solo este dispositivo»: tus datos se guardan aquí y no se sincronizan con otros dispositivos.</p>`;
  else h+=`<p class="sm">Sesión: <b>${esc(u?u.email:'—')}</b></p><p class="sm muted" style="margin-top:4px">Estado: ${esc(st[1])}${n?` · ${plu(n,'bloque','bloques')} por subir`:''}${NB.lastSync?` · última sincronización a las ${hhmm(NB.lastSync)}`:''}.</p>
    <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn" data-act="nbsync">Sincronizar ahora</button><button class="btn" data-act="nbout">${S.nbout?'Pulsa otra vez para cerrar sesión':'Cerrar sesión'}</button></div>
    ${S.nbout?`<p class="sm" style="margin-top:6px;${n?'color:var(--red)':''}">${n?`Hay ${plu(n,'bloque','bloques')} sin subir a la nube: si cierras sesión ahora se perderán esos cambios.`:'Al cerrar sesión se borran los datos de este dispositivo; siguen en tu nube.'}</p>`:''}`;
  if(NB.volatile)h+=`<p class="sm" style="color:var(--red);margin-top:6px">Este navegador no deja guardar datos (¿modo privado?). Lo que apuntes se perderá al cerrar.</p>`;
  h+=`<p class="sm muted" style="margin-top:8px">Norte ${NVER}</p></section>`;
  if(!isStandalone())h+=`<section class="card"><h2>Instalar Norte</h2>${isIOS()?'<p class="sm">En Safari: botón Compartir (el cuadrado con la flecha) › «Añadir a pantalla de inicio». Se abrirá como una app, a pantalla completa y sin internet.</p>':'<p class="sm">En Edge: menú ⋯ › Aplicaciones › «Instalar este sitio como aplicación». En Chrome: menú ⋮ › Transmitir, guardar y compartir › «Instalar página como aplicación». Tendrás su icono en el menú Inicio y en la barra de tareas.</p>'}${BIP?'<div class="acts" style="justify-content:flex-start"><button class="btn" data-act="nbinst">Instalar ahora</button></div>':''}</section>`;
  return h}
if('serviceWorker' in navigator&&!(window.claude&&window.claude.use)&&/^https?:$/.test(location.protocol)&&!window.NORTE_NO_SW)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

render();
connect();
}
</script>
